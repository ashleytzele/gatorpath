# End-to-end eval questions (ARCHITECTURE §12, TASKS Phase 7), run by evals/run_evals.py through a real AI client.
#
# profile: an eval profile ("p03") or a tests/test_server.py scenario ("scenario: sophomore"), or inline. Its terms are
#   shifted so the student is mid-way through fall 2026, then written into the question the way a student would type it.
# prompt: true starts the conversation with the plan_my_degree prompt (README: plans start from it).
# expect: properties scored from the transcript. Facts (prereqs, what's left, offerings) are computed from the tools
#   at scoring time, never written here (golden rule 1). Every answer is also checked for course codes that neither the
#   catalog nor a tool output has, for the profile the client passed (it must match the question), and for save_profile.
#   tools: tools that must be called · mention: prereqs_of / remaining / unlocks_of / seasons_of / close_match_of /
#   areas_of / carries_over_to (a computed fact the answer must state) · mention_any: wording one of which must appear · plan_valid: the
#   last check_plan input re-checked here · goal_fit: picked senior electives match the goal keywords · pace_compared:
#   build_plan at two or more loads · summer_tried / winter_tried: build_plan with summers (Winter Session), or a
#   checked plan with such a term
# followup: a second turn in the same session, with its own expect.

# Goal-fit rubric: words in a course's Bulletin title or description. A rubric, not an academic rule.
goals:
  cybersecurity: [secur, crypt, network, privacy]
  artificial intelligence: [intelligen, machine learning, learning, neural, vision, natural language, robot]
  web development: [web, internet, interface, mobile, software engineering]
  data science: [data, database, statistic, mining, machine learning]
  game development: [game, graphic, animation]
  systems programming: [operating, compil, parallel, distributed, architecture, embedded, systems]

questions:
  # Catalog questions: no profile, no prompt
  - {id: prereq-653, ask: "What do I need before CSC 653 at SF State?", expect: {mention: {prereqs_of: CSC 653}}}
  - {id: prereq-648, ask: "What are the prerequisites for CSC 648 at SF State?", expect: {mention: {prereqs_of: CSC 648}}}
  - {id: prereq-415, ask: "Can I take CSC 415 at SF State next semester if CSC 340 is the only one of its prereqs I've done?",
     expect: {mention: {prereqs_of: CSC 415}}}
  - {id: prereq-m324, ask: "What does MATH 324 at SF State require?", expect: {mention: {prereqs_of: MATH 324}}}
  - {id: prereq-510, ask: "What do I need before CSC 510 at SF State?", expect: {mention: {prereqs_of: CSC 510}}}
  - {id: unlocks-340, ask: "Which required SF State BS CS courses does CSC 340 unlock?", expect: {mention: {unlocks_of: CSC 340}}}
  - {id: offered-652, ask: "Is CSC 652 usually offered in the fall at SF State?",
     expect: {mention_any: ["0 of 4", "0 of the last 4", "none of the last", "not offered in", "hasn't been offered in",
                          "hasn't run in", "not run in", "no fall", "never in"]}}
  - {id: offered-653, ask: "When is CSC 653 usually offered at SF State?", expect: {mention: {seasons_of: CSC 653}}}
  - {id: renumbered-210, ask: "I took CSC 210 at SF State a few years ago. Does it count for the 2026-27 BS CS?",
     expect: {mention: {close_match_of: CSC 210}, mention_any: [advisor, DPR]}}
  - {id: ge-envs-401, ask: "What GE or SF State Studies requirements does ENVS 401 at SF State count for?",
     expect: {mention: {areas_of: ENVS 401}}}

  # "What's left?": a profile, no prompt
  - {id: left-p01, profile: p01, ask: "What's left for my degree?", expect: {tools: [audit_progress], mention: {remaining: true}}}
  - {id: left-p02, profile: p02, ask: "Am I done with my degree requirements?", expect: {tools: [audit_progress]}}
  - {id: left-p03, profile: p03, ask: "What's left for my degree?", expect: {tools: [audit_progress], mention: {remaining: true}}}
  - {id: left-p04, profile: p04, ask: "What's left for my degree?", expect: {tools: [audit_progress], mention: {remaining: true}}}
  - {id: left-p05, profile: p05, ask: "What's left for my degree?", expect: {tools: [audit_progress], mention: {remaining: true}}}
  - {id: left-p06, profile: p06, ask: "What's left for my degree?", expect: {tools: [audit_progress], mention: {remaining: true}}}
  - {id: left-p07, profile: p07, ask: "What's left for my degree?", expect: {tools: [audit_progress], mention: {remaining: true}}}
  - {id: left-p08, profile: p08, ask: "What's left for my degree?", expect: {tools: [audit_progress], mention: {remaining: true}}}
  - {id: left-p09, profile: p09, ask: "What's left for my degree?", expect: {tools: [audit_progress], mention: {remaining: true}}}
  - {id: left-p10, profile: p10, ask: "What's left for my degree?", expect: {tools: [audit_progress], mention: {remaining: true}}}
  # Older catalog years: the student's own year's rules (2024-25: the old GE pattern and the 3/12/25 waivers)
  - {id: left-2025, profile: "scenario: Fall 2025 sophomore", ask: "What's left for my degree?",
     expect: {tools: [audit_progress], mention: {remaining: true}}}
  - {id: left-2024, profile: "scenario: Fall 2024 junior (old GE)", ask: "What's left for my degree?",
     expect: {tools: [audit_progress], mention: {remaining: true}}}
  # BS Applied Mathematics (the second program) and a change of major
  - {id: left-p11, profile: p11, ask: "What's left for my degree?", expect: {tools: [audit_progress], mention: {remaining: true}}}
  - {id: left-p12, profile: p12, ask: "What's left for my degree?", expect: {tools: [audit_progress], mention: {remaining: true}}}
  - {id: switch-math, profile: p03, ask: "What if I switch my major to Applied Mathematics?",
     expect: {tools: [compare_programs], mention: {carries_over_to: bs-applied-math}, mention_any: [What-If, advisor]}}

  # Plans: the plan_my_degree prompt, a goal, everything the prompt would ask for given up front
  - {id: plan-p01, profile: p01, prompt: true, goal: artificial intelligence, ask: "Plan the rest of my degree.",
     expect: {plan_valid: true, goal_fit: true}}
  - {id: plan-p03, profile: p03, prompt: true, goal: cybersecurity, ask: "I'm a CS sophomore. Plan my next 3 years.",
     expect: {plan_valid: true, goal_fit: true},
     followup: {ask: "What if I graduate a year early?", expect: {pace_compared: true}}}
  - {id: plan-fresh-12, profile: "scenario: new freshman, QR 1/2", prompt: true, goal: web development,
     ask: "I'm an incoming freshman. Plan my whole degree.", expect: {plan_valid: true, goal_fit: true},
     followup: {ask: "Can I finish in 3 years?", expect: {pace_compared: true}}}
  - {id: plan-fresh-34-f1, profile: "scenario: new freshman, QR 3/4, F-1", prompt: true, goal: data science,
     ask: "I'm an incoming freshman. Plan my whole degree.", expect: {plan_valid: true, goal_fit: true},
     followup: {ask: "Can I take a lighter last semester?", expect: {mention_any: [Reduced Course Load, RCL]}}}
  - {id: plan-ap, profile: "scenario: freshman with AP credit", prompt: true, goal: game development,
     ask: "I'm an incoming freshman with some AP credit. Plan my degree.", expect: {plan_valid: true, goal_fit: true}}
  - {id: plan-adt, profile: "scenario: ADT transfer", prompt: true, goal: cybersecurity,
     ask: "I'm transferring in with an AS-T. Plan my remaining semesters.", expect: {plan_valid: true, goal_fit: true}}
  - {id: plan-calgetc, profile: "scenario: Cal-GETC transfer, no ADT", prompt: true, goal: artificial intelligence,
     ask: "I'm a transfer student, and none of my transfer courses count toward CS major courses. Plan my remaining
       semesters.", expect: {plan_valid: true, goal_fit: true}}
  - {id: plan-part-time, profile: "scenario: part-time with a deadline", prompt: true, goal: systems programming,
     ask: "I work, so I can only go part-time. Plan my degree.", expect: {plan_valid: true, goal_fit: true},
     followup: {ask: "What if I take summer classes too?", expect: {summer_tried: true}}}
  - {id: plan-junior, profile: "scenario: junior, on track", prompt: true, goal: artificial intelligence,
     ask: "Plan my last two years.", expect: {plan_valid: true, goal_fit: true},
     followup: {ask: "Actually I'd rather focus on cybersecurity. What changes?", goal: cybersecurity,
                expect: {plan_valid: true, goal_fit: true}}}
  - {id: plan-retake, profile: "scenario: retaking a D", prompt: true, goal: web development,
     ask: "I got a D in CSC 215. Plan the rest of my degree.", expect: {plan_valid: true, goal_fit: true}}
  - {id: plan-ccc, profile: "scenario: CCC transfer from another major", prompt: true, goal: data science,
     ask: "I'm transferring from a community college. Plan my remaining semesters.", expect: {plan_valid: true, goal_fit: true}}
  - {id: plan-fast, profile: "scenario: fast, with summers", prompt: true, goal: artificial intelligence,
     ask: "I want to finish as fast as I can. Plan my degree.", expect: {plan_valid: true, goal_fit: true}}
  - {id: plan-p10, profile: p10, prompt: true, ask: "Plan my last semester.", expect: {plan_valid: true}}
  - {id: plan-2025, profile: "scenario: Fall 2025 sophomore", prompt: true, goal: data science,
     ask: "Plan the rest of my degree.", expect: {plan_valid: true, goal_fit: true},
     followup: {ask: "What if I take Winter Session classes too?", expect: {winter_tried: true}}}
  - {id: plan-2024, profile: "scenario: Fall 2024 junior (old GE)", prompt: true, goal: cybersecurity,
     ask: "Plan the rest of my degree.", expect: {plan_valid: true, goal_fit: true}}

  # Honesty: what the tools can't answer, or shouldn't be guessed
  - {id: transfer-guess, profile: {program: bs-cs, catalog_year: 2026-27, transfer_units: 46, first_time: false},
     ask: "Which GE areas do I still need?", expect: {mention_any: [DPR, Degree Progress Report]}}
  - {id: no-415, ask: "At SF State, can I take CSC 653 without CSC 415?", expect: {mention_any: [permission]}}
  - {id: when-graduate, profile: p03, ask: "When will I graduate?", expect: {tools: [build_plan]}}
  - {id: opt, profile: "scenario: new freshman, QR 3/4, F-1",
     ask: "Can I work on OPT after I graduate, and for how long?", expect: {mention_any: [international, International]}}
  - {id: fake-course, ask: "Is CSC 999 a good senior elective for the SF State BS CS?", expect: {mention_any: ["not in", "isn't in", "doesn't exist",
     "does not exist", "no CSC 999", "not a", "isn't a", "no such", "isn't listed", "not listed", "couldn't find",
     "no course with"]}}
  - {id: winter-ge, profile: "scenario: Fall 2025 sophomore", ask: "Can I take one of my GE classes in Winter Session?",
     expect: {mention_any: ["4 units", "four units"]}}
  - {id: cr-major, ask: "Can I take MATH 226 CR/NC and still count it for the SF State CS major?", expect: {mention_any: ["1905"]}}
