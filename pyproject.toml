[project]
name = "gatorpath"
version = "0.2.0"
description = "MCP server for verifiable SF State degree planning"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "ashleytzele" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.120",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "uvicorn>=0.34",
]

[project.scripts]
gatorpath = "gatorpath:main"
gatorpath-web = "gatorpath.api:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]  # never data/ (a Codex home there carries its plugins' own tests)
