[project]
name = "gatorpath"
version = "0.1.0"
description = "MCP server for verifiable SF State degree planning"
readme = "README.md"
authors = [
    { name = "ashleytzele" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
gatorpath = "gatorpath:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
