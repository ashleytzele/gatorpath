# First-pass review against this Bulletin text: Claude, 2026-10-23 (fixes listed in TASKS.md).
# elective_no_community_college (p.1859) "Courses from community colleges cannot be substituted for the courses on the list below.": the list is upper-division courses, and community college work is never upper division (p.2304: the university's community_college_upper_division)
# elective_double_major_chem_343 (p.1860) "For students who pursue a double major in the BA Chemistry and BS Biochemistry programs, CHEM 343 cannot be used to meet the elective requirement for the BA Chemistry.": the electives' exceptions text: a double major isn't modeled
# elective_repeat_limit (p.1860) "May be repeated and up to 2 units used towards Elective requirement.": CHEM 686 (footnote 2) has its own filter in the electives, max_units: 2
# elective_petition (p.1860) "By petition only. Units must be taken in the same semester to be used as an upper division elective.": CHEM 699 (footnote 3) counts only as an approved course in the electives; the footnote is in their exceptions text
# prerequisite_grade (p.1859) "Grades of C or better are required in Chemistry prerequisite courses.": min_grade C on the CHEM courses another course in the major names as a prerequisite (CHEM 115, 215, 233, 234, 235, 300, 321, 322, 325, 340, 349, 351, 685), whose prereq text also says C or better
