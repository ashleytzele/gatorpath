program: ba-cinema
title: Bachelor of Arts in Cinema
catalog_year: 2026-27
verified: false
verified_by: null
total_units: 45
source: p.987
groups:
- id: core
  title: Core Courses (13 units)
  all_of:
  - CINE 200
  - CINE 202
  - CINE 204
  - CINE 211
  - CINE 212
  min_grade: C
  quote: Core courses must be completed with a grade of C or better.
  source: p.987
  exceptions: With a faculty advisor’s approval, up to 13 units from a community college may be applied to the core courses
    in the Cinema major. Up to 6 of those units may be in screenwriting and/or filmmaking/video production.
- id: foundation
  title: Foundation Courses
  all_of:
  - CINE 340
  - CINE 341
  min_grade: C
  quote: Foundation courses must be completed with a grade of C or better.
  source: p.987
- id: gwar
  title: 'Foundation and GWAR Courses: Select One (CINE 303GW, CINE 343GW or CINE 350GW)'
  one_of:
  - - CINE 303GW
  - - CINE 343GW
  - - CINE 350GW
  min_grade: C
  quote: Complete the core, foundation, and GWAR courses with a grade of C or better.
  source: p.987
- id: upper_division_cinema_studies
  title: Upper-Division Cinema Studies Courses (9 units)
  choose_units: 9
  from:
  - subject: CINE
    level: 300
  - subject: CINE
    level: 500
