# Bachelor of Science in Computer Science, Bulletin 2024-25 (printed pp.1944-1945). Written from the 2025-26 file by a
# rule diff (ARCHITECTURE §5): same groups and grade rule; the printed elective list differs (CSC 649 Search Engines
# and CSC 658 Programming Cafe, both dropped from later Bulletins; CSC 615 is "UNIX Programming").
# Vocabulary: ARCHITECTURE §6.2. Quotes are the Bulletin's own words.
program: bs-cs
title: Bachelor of Science in Computer Science
catalog_year: 2024-25
verified: false                   # a second person checks every rule against the PDF, then flips this
verified_by: null
total_units: 74                    # "Computer Science (B.S.) – 74 units"
dpr_plan: Computer Science-BS     # how the DPR's "Plan:" line names this program (DPR sample, 2026-10-16)
source: "p.1944"
global:
  no_cr_nc: true                   # "CR/NC grades are not accepted in courses for the Computer Science major."
  source: "p.1944"
groups:
  - id: math_physics
    title: Mathematics and Physics (22 units)
    all_of: [MATH 225, MATH 226, MATH 227, MATH 324, PHYS 220, PHYS 222, PHYS 230, PHYS 232]
    # No group minimum in 2025-26: "Grades of C or better are required for CSC 510 and CSC 648." (prereqs still ask
    # for C in many of these, e.g. PHYS 230 needs MATH 227 with C or better)
    source: "p.1944"
  - id: core_cs
    title: Core Computer Science Requirements (28 units)
    all_of: [CSC 101, CSC 215, CSC 220, CSC 230, CSC 256, CSC 300GW, CSC 317, CSC 340, CSC 413]
    source: "p.1944"
  - id: advanced_cs
    title: Advanced Computer Science Requirements (9 units)
    all_of: [CSC 415, CSC 510, CSC 648]
    min_grade: {CSC 510: C, CSC 648: C}   # "Grades of C or better are required for CSC 510 and CSC 648."
    source: "p.1944"
  - id: senior_electives
    title: Electives (15 units)
    # "All students must complete five 3-unit senior electives. At least 12 units must be CSC courses."
    # "Exceptions must be approved in advance by a senior advisor."
    # The list names CSC 699 (1-3 units), and "any 600-level CSC course" takes in 1-unit CSC 685/686: units count
    # toward the 15, and a course under 3 units is flagged for a senior advisor (`course_units`).
    choose_units: 15
    course_units: 3
    exceptions: "Exceptions must be approved in advance by a senior advisor."
    from:
      - list: [CSC 520, CSC 600, CSC 615, CSC 620, CSC 621, CSC 630, CSC 631, CSC 641, CSC 642, CSC 645,
               CSC 647, CSC 649, CSC 651, CSC 652, CSC 656, CSC 657, CSC 658, CSC 664, CSC 665, CSC 667,
               CSC 668, CSC 671, CSC 675, CSC 676, CSC 680, CSC 690, CSC 698, CSC 699,
               MATH 400, MATH 425, MATH 448]
      # "any 600-level CSC course, with the exception of CSC 601, CSC 602, CSC 648, and CSC 694"
      - {subject: CSC, level: 600, except: [CSC 601, CSC 602, CSC 648, CSC 694]}
      # "one CSC graduate course … (700-level or higher, and non-paired excluding CSC 895, CSC 898, CSC 897, CSC 899)"
      - {subject: CSC, level: "700+", paired: false, except: [CSC 895, CSC 897, CSC 898, CSC 899], max_courses: 1}
    min_units_from: {subject: CSC, units: 12}
    source: "p.1944-1945"

# Advice for transfer students, printed with the program (not requirements; shown by get_program_requirements).
transfer_notes:
  - text: "All lower division courses (course numbers below 300) included among the degree requirements are available at many community colleges in California; students intending to enter the program upon transferring to San Francisco State University from a community college should take as many of those courses there as possible."
    source: "p.1944"
  - text: "Before transfer, complete as many lower-division requirements or electives for this major as possible."
    source: "p.1945"
  - text: "No specific degree is required for admission as an upper-division student. However, the ADT includes specific guarantees related to admission and graduation and is designed to clarify the transfer process and strengthen lower-division preparation for the major."
    source: "p.1945"
  - text: "Students pursuing an ADT are guaranteed admission to the CSU if minimum eligibility requirements are met, though not necessarily to the CSU campus of primary choice."
    source: "p.1945"
  - text: "Students who have earned an ADT should seek advising in the major department during the first semester of attendance."
    source: "p.1945"
  - text: "A course in U.S. History and a course in U.S. & California Government are not required for admission but are required for graduation; students are strongly encouraged to complete them before transfer."
    source: "p.1946"
  - text: "Use ASSIST (assist.org) to find which California Community College courses satisfy lower-division major requirements, CSU GE, US History, and US & CA Government."
    source: "p.1946"
  - text: "Remedial courses are not transferable and do not apply to the minimum 60 semester units / 90 quarter units required for admission. Additional units for repeated courses do not apply to the minimum 60 units required for upper-division transfer."
    source: "p.1946"
  - text: "Before leaving the last community college, obtain a summary of completed lower-division GE units (IGETC or CSU GE Breadth), the GE certification worksheet, and keep it for verifying degree progress after transfer."
    source: "p.1946"
  - text: "AP/IB/CLEP credit is not transferred automatically: units are awarded only when an official score report is delivered to SF State, under the Bulletin in effect the year of the exam."
    source: "p.1946"
  - text: "STEM majors often defer 6-9 units of lower-division GE in Areas C and D until after transfer (not for students completing an associate degree before transfer)."
    source: "p.1946"
  - text: "From outside CCCs and CSUs: the four basic skills courses required for admission meet A1, A2, A3, and B4 in the SF State GE pattern. Critical thinking (A3) may not be widely offered outside the CCC and CSU systems: identify and take an appropriate course no later than the term of application to the CSU. Waiting until after transfer to take a single SF State course that meets both US and CA/local government may be an option, particularly from outside California."
    source: "p.1946"

# Advising handoff (ARCHITECTURE §7.5). From the CS department's advising page; recheck yearly.
advising:
  - role: major_advisor
    who: Computer Science department advisor
    when: planning the major, "as soon as possible"; transfer students bring transcripts and a list of major-related courses
    link: "https://cs.sfsu.edu/undergrads/advising"
    how_to_book: "Schedule through Navigator at https://sfsu.campus.eab.com/. Email cs-dept@sfsu.edu if you can't access Navigator."
    guide: "https://sfsu.box.com/shared/static/9c7otro8xto3gn9ufhwu7rpdxm9269jw.pdf"
    location: "Thornton Hall 323, Mon-Fri 9 a.m.-4 p.m."
    contact: "cs-dept@sfsu.edu, (415) 338-1244"
    source: "cs.sfsu.edu/undergrads/advising, checked 2026-10-16"
  # Offices, never named people (they change): the department routes the request to its senior advisor.
  - role: substitutions
    who: Computer Science department (a senior advisor approves)
    when: any course substitution or senior-elective exception ("must be approved in advance by a Senior Advisor")
    link: "https://cs.sfsu.edu/undergrads/advising"
    how_to_book: "Email cs-dept@sfsu.edu, or book a department advisor in Navigator (https://sfsu.campus.eab.com/), and ask for a senior advisor's approval before taking the course."
    contact: "cs-dept@sfsu.edu, (415) 338-1244"
    source: "cs.sfsu.edu/undergrads/advising (quote), Bulletin p.1944-1945; checked 2026-10-16"
  - role: college_advising
    who: College of Science & Engineering Advising Team
    when: CS majors are routed to this team in Navigator for college-level advising
    link: "https://advising.sfsu.edu/advising-services"
    how_to_book: "Navigator, https://sfsu.campus.eab.com/"
    source: "advising.sfsu.edu/advising-services, checked 2026-10-16"
