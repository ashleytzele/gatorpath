# Bachelor of Science in Applied Mathematics, Bulletin 2024-25 (printed pp.2119-2121). Written from the 2025-26 file by
# a rule diff (ARCHITECTURE §5): the requirement text is the same word for word (bs-applied-math.source.txt vs the
# 2025-26 one); pages differ, and the transfer advice names the older GE areas. Claude, 2026-10-28. verified: false
# until a person checks it against the PDF.
# Vocabulary: ARCHITECTURE §6.2. Quotes are the Bulletin's own words.
program: bs-applied-math
title: Bachelor of Science in Applied Mathematics
catalog_year: 2024-25
verified: false                    # a second person checks every rule against the PDF, then flips this
verified_by: null
total_units: 55                    # "Applied Mathematics (B.S.) — 55 units minimum"
# dpr_plan: not set until a real DPR shows how its "Plan:" line names this program; import_dpr can't map one yet
source: "p.2119"
global:
  no_cr_nc: true                   # "CR/NC grades are not acceptable in courses to be counted for a mathematics major program."
  source: "p.2119"
groups:
  # "Required Courses (40-44 units)": the fixed courses here, the two "Select One" blocks below. MATH 696 & MATH 697
  # print as one 3-unit row (1 + 2 units in the course listing, p.2101).
  - id: required
    title: Required Courses
    all_of: [MATH 226, MATH 227, MATH 228, MATH 301GW, MATH 325, MATH 376, MATH 400, MATH 440, MATH 460,
             MATH 696, MATH 697]
    source: "p.2119"
  - id: programming
    title: "Required Courses: Select One (MATH 209, CSC 101 & CSC 215, or CSC 309)"
    one_of: [[MATH 209], [CSC 101, CSC 215], [CSC 309]]   # "Select One: 3-7" units
    source: "p.2119"
  - id: theory
    title: "Required Courses: Select One (MATH 335, MATH 370 or MATH 380)"
    choose_units: 3                # "Select One: 3"
    from: {list: [MATH 335, MATH 370, MATH 380]}
    source: "p.2119"
  # "Electives (15 units)": six units from the list, plus nine units the advisor approves.
  - id: major_electives
    title: "Electives: six units from the list"
    choose_units: 6                # "Select six units of the following: 6"
    from: {list: [MATH 430, MATH 442, MATH 447, MATH 448, MATH 449, MATH 471, MATH 477, MATH 491, MATH 495]}
    source: "p.2119"
  - id: application_electives
    title: "Electives: three application courses (9 units)"
    choose_units: 9
    approval: "A coherent collection of three courses emphasizing applications of mathematics, chosen with the consent of the applied mathematics advisor"
    from: {approved: true}
    source: "p.2119"

# Advice for transfer students, printed with the program (not requirements; shown by get_program_requirements).
transfer_notes:
  - text: "No specific degree is required for admission as an upper-division student. However, the ADT includes specific guarantees related to admission and graduation and is designed to clarify the transfer process and strengthen lower-division preparation for the major."
    source: "p.2120"
  - text: "Students pursuing an ADT are guaranteed admission to the CSU if minimum eligibility requirements are met, though not necessarily to the CSU campus of primary choice."
    source: "p.2120"
  - text: "Students who have earned an ADT should seek advising in the major department during the first semester of attendance."
    source: "p.2121"
  - text: "Before transfer, complete as many lower-division requirements or electives for this major as possible."
    source: "p.2121"
  - text: "A course in U.S. History and a course in U.S. & California Government are not required for admission but are required for graduation; students are strongly encouraged to complete them before transfer."
    source: "p.2121"
  - text: "Use ASSIST (assist.org) to find which California Community College courses satisfy lower-division major requirements, CSU GE, US History, and US & CA Government."
    source: "p.2121"
  - text: "Remedial courses are not transferable and do not apply to the minimum 60 semester units / 90 quarter units required for admission. Additional units for repeated courses do not apply to the minimum 60 units required for upper-division transfer."
    source: "p.2121"
  - text: "Before leaving the last community college, obtain a summary of completed lower-division GE units (IGETC or CSU GE Breadth), the GE certification worksheet, and keep it for verifying degree progress after transfer."
    source: "p.2121"
  - text: "AP/IB/CLEP credit is not transferred automatically: units are awarded only when an official score report is delivered to SF State, under the Bulletin in effect the year of the exam."
    source: "p.2121"
  - text: "STEM majors often defer 6-9 units of lower-division GE in Areas C and D until after transfer (not for students completing an associate degree before transfer)."
    source: "p.2121"
  - text: "From outside CCCs and CSUs: the four basic skills courses required for admission meet A1, A2, A3, and B4 in the SF State GE pattern. Critical thinking (A3) may not be widely offered outside the CCC and CSU systems: identify and take an appropriate course no later than the term of application to the CSU. Waiting until after transfer to take a single SF State course that meets both US and CA/local government may be an option, particularly from outside California."
    source: "p.2121"

# Advising handoff (ARCHITECTURE §7.5). Offices and roles, never named people (D15): the advising page lists the
# Applied Mathematics advisors by the student's last name. Recheck yearly.
advising:
  - role: major_advisor
    who: Applied Mathematics advisor, Department of Mathematics (listed by the first letter of your last name)
    when: planning the major; ADT students "during the first semester of attendance" (p.2121)
    link: "https://math.sfsu.edu/advising"
    how_to_book: "Email the Applied Mathematics advisor listed for your last name at https://math.sfsu.edu/advising (office hours are linked there). In summer, the department chair advises. Questions to statmath@sfsu.edu."
    location: "Thornton Hall 937 (TH 937)"
    contact: "statmath@sfsu.edu, (415) 338-2251"
    source: "math.sfsu.edu/advising, checked 2026-10-22; Bulletin p.2094 (office, phone, email)"
  - role: substitutions
    who: Applied Mathematics advisor, Department of Mathematics
    when: choosing the three application electives ("chosen with the consent of the applied mathematics advisor"), a course substitution, or a transfer course equivalency
    link: "https://math.sfsu.edu/advising"
    how_to_book: "Ask the Applied Mathematics advisor for your last name (https://math.sfsu.edu/advising) before taking the courses. Transfer course equivalency questions go to statmath@sfsu.edu."
    contact: "statmath@sfsu.edu, (415) 338-2251"
    source: "math.sfsu.edu/advising (\"All inquires about course equivalency for transfer courses should go to statmath@sfsu.edu\"), checked 2026-10-22; Bulletin p.2119"
