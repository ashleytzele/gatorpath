# Graduation requirements shared by every bachelor's degree, Bulletin 2026-27.
# GE areas match `course.ge_areas` (from each course's "Course Attributes:"), so no GE course lists here.
# Grades: CR = "equivalent to grades A through C-" (p.2403), so CR meets a C- minimum but not a C.
catalog_year: 2026-27
verified: false
verified_by: null
totals:
  min_units: 120                   # "B.S. = 120 units minimum"
  min_upper_division_units: 30     # "Upper-Division Requirement: 30 units minimum." Upper division = 300+ (p.1905)
  residence: {units: 30, upper_division: 24, major: 12}   # "30 units minimum at SF State, including 24 units upper-division, and 12 units in the major"
  max_cr_units: 24                 # SF State units graded CR; "Major courses only offered as CR/NC are not included"
  min_gpa: {all: 2.0, sf_state: 2.0, major: 2.0}
  source: "p.2313"
# "The class level of students is determined according to units completed (earned units)":
# Freshman 0-29, Sophomore 30-59, Junior 60-89 (upper division), Senior 90 or more. Graduate = holds a degree.
class_level: {sophomore: 30, upper: 60, senior: 90, source: "p.2390"}
# "the normal academic load for undergraduates is 12 to 15 units per semester and 8 units in the summer"
academic_load: {normal_max: 15, summer_normal_max: 8, source: "p.2393"}
# Older GE area codes (on DPRs of earlier catalog years) -> this Bulletin's areas, used to read a DPR's ge_done.
# Evidence: every 2026-27 course that carries the old tag also carries the new one (all "Course Attributes:"
# counted 2026-10-17, e.g. C2 + 3B on 199 of 199 courses, UD-C + 3UD on 549 of 549), and prereqs pair them
# ("GE Areas 1A/A2*, 1B/A3*, 1C/A1*, and 2/B4*", A U 101 p.2449; "5A/B1" PHYS 305 p.2162; "5B/B2" DANC 304
# p.1667; "6/F" SOC 479 p.848). No current course carries E, D3 or A4.
legacy_ge_areas:
  map: {A1: 1C, A2: 1A, A3: 1B, B1: 5A, B2: 5B, B3: 5C, B4: "2", C1: 3A, C2: 3B, "C3 OR C2": 3B,
        D: "4", D1: "4", D2: "4", F: "6", GE-F: "6", UD-B: 5UD, UD-C: 3UD, UD-D: 4UD}
  none: [E, D3, A4]
  source: "co-tagged Course Attributes in the 2026-27 Bulletin; prereq pairings p.2449, p.2162, p.1667, p.848"
repeats:
  forgiveness_units: 16            # lower grade leaves the GPA for up to 16 SF State units; past that both count
  source: "p.2392, p.2406"
groups:
  # General Education, 43 units (table p.2311-2312). Area minimums below add up to 43.
  - {id: ge_1a, title: "GE 1A English Composition", choose_units: 3, from: {ge_area: 1A}, min_grade: C-, source: "p.2314"}
  - {id: ge_1b, title: "GE 1B Critical Thinking", choose_units: 3, from: {ge_area: 1B}, min_grade: C-, source: "p.2314"}
  - {id: ge_1c, title: "GE 1C Oral Communication", choose_units: 3, from: {ge_area: 1C}, min_grade: C-, source: "p.2314"}
  # "Area 1 courses must be completed with a grade of CR or C– or better" (p.2314); same wording for Area 2 (p.2315)
  - {id: ge_2, title: "GE 2 Mathematical Concepts and Quantitative Reasoning", choose_units: 3, from: {ge_area: "2"}, min_grade: C-, source: "p.2315"}
  - {id: ge_3a, title: "GE 3A Arts", choose_units: 3, from: {ge_area: 3A}, source: "p.2315"}
  - {id: ge_3b, title: "GE 3B Humanities", choose_units: 3, from: {ge_area: 3B}, source: "p.2315"}
  - {id: ge_4, title: "GE 4 Social and Behavioral Sciences", choose_units: 6, from: {ge_area: "4"}, source: "p.2317"}
  - {id: ge_5a, title: "GE 5A Physical Science", choose_units: 3, from: {ge_area: 5A}, source: "p.2319"}
  - {id: ge_5b, title: "GE 5B Biological Science", choose_units: 3, from: {ge_area: 5B}, source: "p.2319"}
  - {id: ge_5c, title: "GE 5C Laboratory", choose_units: 1, from: {ge_area: 5C}, source: "p.2319"}
  - {id: ge_6, title: "GE 6 Ethnic Studies", choose_units: 3, from: {ge_area: "6"}, source: "p.2312"}
  - {id: ge_ud_sci, title: "GE 5UD or 2UD Upper-Division Science or Math/QR", choose_units: 3, from: {ge_area: [5UD, 2UD]}, source: "p.2320"}
  - {id: ge_3ud, title: "GE 3UD Upper-Division Arts or Humanities", choose_units: 3, from: {ge_area: 3UD}, source: "p.2320"}
  - {id: ge_4ud, title: "GE 4UD Upper-Division Social and Behavioral Sciences", choose_units: 3, from: {ge_area: 4UD}, source: "p.2320"}
  # "The three courses taken in Area 4 (one upper-division and two lower-division) must be in at least two different disciplines."
  - {id: ge_4_disciplines, title: "GE Area 4 in two or more disciplines", distinct_subjects: 2, across: [ge_4, ge_4ud], source: "p.2317"}
  # GWAR: "identified with a GW after the course number and must be completed with a grade of C- or better"
  - {id: gwar, title: "Graduation Writing Assessment Requirement", choose_n: 1, from: {ge_area: GW}, min_grade: C-, source: "p.2313"}
  # SF State Studies. Waived for a verified AA-T/AS-T in a similar major (p.2313).
  - {id: sfss_aerm, title: "SF State Studies: American Ethnic and Racial Minorities", choose_n: 1, from: {ge_area: AERM}, waived_if: adt, source: "p.2313"}
  - {id: sfss_esca, title: "SF State Studies: Environmental Sustainability and Climate Action", choose_n: 1, from: {ge_area: ESCA}, waived_if: adt, source: "p.2313"}
  - {id: sfss_gp, title: "SF State Studies: Global Perspectives", choose_n: 1, from: {ge_area: GP}, waived_if: adt, source: "p.2313"}
  - {id: sfss_sj, title: "SF State Studies: Social Justice", choose_n: 1, from: {ge_area: SJ}, waived_if: adt, source: "p.2313"}
  # American Institutions: U.S. History, and U.S. and California Government (USG/CSLG courses cover both parts).
  - {id: ai_ush, title: "American Institutions: U.S. History", choose_n: 1, from: {ge_area: USH}, source: "p.2313, p.2350"}
  - {id: ai_usg, title: "American Institutions: U.S. Government", choose_n: 1, from: {ge_area: USG}, source: "p.2313, p.2350"}
  - {id: ai_cslg, title: "American Institutions: California State and Local Government", choose_n: 1, from: {ge_area: CSLG}, source: "p.2313, p.2350"}

# Advising handoff (ARCHITECTURE §7.5). Copied from the pages named in each `source`; recheck yearly.
# `role` is what the planner asks for; a program's entry with the same role wins.
advising:
  - role: general_advising
    who: Undergraduate Advising Center (UAC)
    when: GE, university requirements, graduation questions, any undergraduate
    link: "https://advising.sfsu.edu/"
    how_to_book: "Book in-person or virtual appointments online at https://sfsu.campus.eab.com/. No same-day online appointments; use drop-in hours for urgent needs. Booking help: (415) 338-2101."
    guide: "https://athelp.sfsu.edu/hc/en-us/articles/1500012835062-How-to-Schedule-an-Advising-Appointment-"
    location: Admin 203
    contact: uacadvising@sfsu.edu
    source: "advising.sfsu.edu and advisinghub.sfsu.edu/node/4, checked 2026-10-16"
  - role: directory
    who: Advising Hub (directory of all advising offices)
    when: finding the right office
    link: "https://advisinghub.sfsu.edu/"
    source: "linked from the Student Center DPR page; checked 2026-10-16"
  - role: dpr
    who: Your DPR (official degree audit)
    when: confirming what counts, after any exception or transfer evaluation
    link: "Student Center → Degree Progress Report (cmsweb.sfsu.edu, sign-in required)"
    contact: "Registrar's Office, for AP/IB/CLEP credit or petitions missing from the DPR (per the DPR's Important Alerts)"
    source: "DPR page, 2026-10-16"
