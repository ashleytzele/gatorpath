    - MATH 228
    - PHYS 220
    - PHYS 222
    - PHYS 230
    - PHYS 232
    - PHYS 240
    - PHYS 242
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AS-T in Physics. Twenty-four units in the major (MATH 226, MATH 227, MATH 228, PHYS 220, PHYS 222, PHYS 230, PHYS
      232, PHYS 240, and PHYS 242) and all lower-division GE requirements have been satisfied. Additional units in the major
      may have been satisfied. Check with a major advisor about the most appropriate course sequence. Degree completion guaranteed
      in 60 units; see the Associate Degree for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units) - US History, US Government, California
      State and Local Government. See next bullet if not completed before transfer. Upper division GE (9 units): Courses approved
      for both UD GE and American Institutions may double-count. Students entering the major with the AS-T in Physics are
      not required to fulfill SF State Studies requirements.'
    - 'Physics B.S. (Astrophysics) Major: 48 units. MATH 226, MATH 227, MATH 228, PHYS 220, PHYS 222, PHYS 230, PHYS 232,
      PHYS 240, and PHYS 242 met in transfer. Prerequisites (7 units); Upper-division Requirements (35 units); Upper-division
      Electives (6 units).'
    - 'University Electives: 3 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., both in UD GE and the major.'
    - 'Major Electives (6 units): Minimum 3 units numbered 400-499, maximum 3 units outside PHYS or ASTR with prior permission
      of a faculty major advisor. (footnote 1)'
