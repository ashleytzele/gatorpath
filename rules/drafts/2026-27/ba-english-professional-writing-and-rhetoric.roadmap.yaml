  adt:
    title: 'Bachelor of Arts in English: Concentration in Professional Writing and Rhetoric – Associate Degree for Transfer
      (ADT) Roadmap'
    total_units: 60
    source: p.1178-1179
    met_in_transfer:
    - ENG 218
    - ENG 250
    notes:
    - This is a sample roadmap for students who transfer to San Francisco State University in the current Bulletin year with
      an approved ADT with 60 units in transfer. Six units in the major (ENG 218, ENG 250) and all GE requirements have been
      satisfied. Additional units in the major may have been satisfied. Check with a major advisor about the most appropriate
      course sequence. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section for more
      information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not taken before transfer. Upper-Division GE Areas 2UD/5UD, 3UD, and 4UD
      (9 units): Courses required for the major may double-count if approved for UD GE. Students entering this major with
      an approved ADT are not required to fulfill SF State Studies requirements. Complementary Studies: Consult with a department
      advisor on how transfer units and/or SF State units can be applied to ensure degree completion within 60 units.'
    - 'English (Professional Writing and Rhetoric) Major: 39 Units. Upper-Division Core (18 units). Concentration Requirements
      (21 units) includes: ENG 540, ENG 545, ENG 618. Electives (9 units): Select in consultation with an advisor. Capstone
      Experience (3 units): ENG 660. Must be taken in the final semester of the final year.'
    - 'University Electives: 9 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State - some courses may meet more than one requirement,
      e.g., UD GE and the major.'
    - '1: Concentration Electives (9 units). A full list of courses that can fulfill this requirement can be found in the
      Degree Requirements (p. 1173).'
    - 'Associate Degrees for Transfer (ADTs) that are approved for the BA in English: Concentration in Professional Writing
      and Rhetoric are: AA-T Communication Studies; AA-T English; AA-T Journalism; AA-T Law, Public Policy, and Society; AA-T
      Social Justice Studies.'
