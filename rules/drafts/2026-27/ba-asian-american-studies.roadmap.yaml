  adt:
    title: Bachelor of Arts in Asian American Studies – Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.442-443
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an approved ADT. All lower-division GE requirements have been satisfied. Check with a major advisor about the most appropriate
      course sequence. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section for more
      information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not taken before transfer. Upper-Division GE (9 units): Courses required
      for the major may double-count if approved for UD GE. Students entering the major with an approved ADT are not required
      to fulfill SF State Studies requirements.'
    - 'Asian American Studies Major: 36 Units. Introduction to Asian American Studies (6 units); Ethnic (9 units): Select
      three courses representing at least two different ethnic groups; Panethnic (9 units); Additional Courses Required for
      the Major (9 units); Graduation Writing Assessment Requirement (GWAR) (3 units): ETHS 300GW.'
    - 'University Electives: 9 or More Units. Units depend on course choices made at the community college, how transferred
      units are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., in both UD GE and the major.'
    - 1 If US History and US/CA Government not met in transfer, it is recommended that students select AA S 210 for US History
      or AA S 213 for US/CA Government.
    - 2 Ethnic Course (9 units). A full list of courses that can fulfill this requirement can be found in the Degree Requirements
      (p. 437).
    - 3 Panethnic Course (9 units). A full list of courses that can fulfill this requirement can be found in the Degree Requirements
      (p. 437).
    - 'Associate Degrees for Transfer (ADTs) that are approved for the BA in Asian American Studies are: AA-T in Anthropology;
      AA-T in Asian American Studies; AA-T in Global Studies; AA-T in Law, Public Policy, and Society; AA-T in Social Justice
      Studies; AA-T in Social Work and Human Services.'
    semesters:
