  adt:
    title: Bachelor of Arts in Bilingual Spanish Journalism – JOUR Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.1376-1377
    notes:
    - This is a sample roadmap for students who transfer to San Francisco State University in the current Bulletin year with
      an AA-T in Journalism. All lower-division GE requirements have been satisfied. Check with a major advisor about the
      most appropriate course sequence. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT)
      section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not completed prior to transfer. Upper-Division GE Areas 2UD/5UD, 3UD, and
      4UD (9 units): Courses required for the major may double-count if approved for UD GE. Students entering this major with
      an approved ADT are not required to fulfill SF State Studies requirements. Complementary Studies: Consult with a department
      advisor on how transfer units and/or SF State units can be applied to ensure degree completion within 60 units.'
    - 'Bilingual Journalism Major: 39-43 Units. Core (27-30 units). Electives (6 units). Practicum (3 units). Capstone (3-4
      units).'
    - 'University Electives: 6 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State - some courses may meet more than one requirement,
      e.g., UD GE and the major.'
    - '1: Students with appropriate heritage speaker skills may test out of SPAN 215.'
    - '2: Major Electives (6 units). A full list of courses that can fulfill this requirement can be found in the Degree Requirements
      (p. 1371).'
