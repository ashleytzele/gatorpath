    total_units: 120
    source: p.1140-1141
    notes:
    - 120 Total Units Required
    - 'Minimum Number of Units in the Major: 45'
    - This roadmap is a suggested plan of study and does not replace meeting with an advisor. Please note that students may
      need to adjust the actual sequence of courses based on course availability. Please consult your Degree Planner (https://registrar.sfsu.edu/degreeplanner)
      and an advisor for further guidance.
    - To avoid taking additional units, it is recommended that you meet the SF State Studies (AERM, GP, ESCA, SJ) requirements
      within your GE or major.
    - '1: Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 1A course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/)'
    - '2: Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 2 course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/)'
    - '3: Complementary Studies Requirement for English Majors. 12 units of Complementary Studies are required of all candidates
      in any of the four concentrations (Literature, Linguistics, English Education, and Professional Writing and Rhetoric)
      in the Bachelor of Arts degree in English. These units must come from courses bearing a prefix other than ENG, and must
      not be cross-listed with ENG. English majors will be offered four pathways for satisfying this requirement; each pathway
      is designed to facilitate graduation in a timely manner. 1. Foreign Language: 12 units in a single foreign language;
      2. Second Major, Minor, or Certificate: 12 units of coursework taken as part of a second major, a minor, or a certificate;
      3. Study Abroad: 12 units of coursework taken in an approved study abroad program (such as CSU Study Abroad); 4. Related
      Subjects: 12 units of coursework in related disciplines with the approval of an English Department advisor. Related
      subjects typically include (but are not limited to) Comparative and World Literature, Classics, Creative Writing, Ethnic
      Studies, Foreign Languages, History, Journalism, and Women and Gender Studies. For this option, six units must be from
      classes in a non-literary related field. Depending on the concentration within the major, CS pathway, and with the approval
      of a departmental advisor, up to 12 units from courses with non-ENG prefixes that count towards the Complementary Studies
      requirement may also count as English electives in fulfillment of major requirements. Students who have earned AA-T
      or AS-T degrees and are pursuing a similar B.A. degree at SF State are required to fulfill the Complementary Studies
      requirement as defined by the major department. Students should consult with a major advisor about how transfer units
      and/or SF State units can best be applied to this requirement in order to ensure degree completion within 60 units.'
    - '4: Consider taking a class combined with a laboratory or a separate lab to fulfill 5C if not already satisfied.'
    - '5: First-time freshmen must take one lower-division Area 4 course that meets US History (USH).'
    - '6: Major Electives (9 units). Three courses selected with the approval of an advisor.'
