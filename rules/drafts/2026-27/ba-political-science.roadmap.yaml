  adt:
    title: Bachelor of Arts in Political Science – LPPS Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.1646-1647
    met_in_transfer:
    - PLSI 200
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AA-T in Law, Public Policy, and Society. Up to 3 units in the major (PLSI 200) plus all lower-division GE and American
      Institutions requirements have been satisfied. Additional units in the major may have been satisfied. Check with a major
      advisor about the most appropriate course sequence. Degree completion guaranteed in 60 units; see the Associate Degree
      for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-12 units. American Institutions (0 units): Met in transfer. Upper-division GE areas
      2UD/5UD, 3UD, 4UD (9 units): Courses required for the major may double-count if approved for UD GE. Students entering
      this major with the AA-T in Law, Public Policy, and Society are not required to fulfill SF State Studies requirements.'
    - 'Political Science Major: 36-37 Units. PLSI 200 met in transfer. Core (16 units): PLSI 250, PLSI 275, PLSI 302GW, PLSI
      303, and Methods option. Fields requirement (17 units). Senior Seminar: Culminating Experience (3-4 units).'
    - 'University Electives: 14 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State - some courses may meet more than one requirement,
      e.g., in both UD GE and the major.'
    - 1 Fields Requirement (17 units). A full list of courses that can fulfill this requirement can be found in the Degree
      Requirements (p. 1640).
    - 2 Culminating Experience (3-4 units). A full list of courses that can fulfill this requirement can be found in the Degree
      Requirements (p. 1640).
