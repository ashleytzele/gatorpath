  adt:
    title: 'Bachelor of Science in Nutrition and Dietetics: Concentration in Foods and Community Nutrition – NUTR Associate
      Degree for Transfer (ADT) Roadmap'
    total_units: 60
    source: p.687-688
    met_in_transfer:
    - CHEM 115
    - NUTR 253
    - PSY 200
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AS-T in Nutrition and Dietetics. At least 14 units in the major (BIOL 210/BIOL 211, CHEM 115, NUTR 253, and PSY 200)
      and all lower-division GE requirements have been satisfied. Additional units in the major may have been satisfied. Check
      with a major advisor about the most appropriate course sequence. Degree completion guaranteed in 60 units; see the Associate
      Degree for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 units. American Institutions (0-6 units) - US History, US Government, California
      State and Local Government. See the next bullet if not completed before transfer. Upper Division GE areas 2UD/5UD, 3UD,
      and 4UD (9 units) – Courses required for the major may double-count if approved for UD GE. Students entering this major
      with the AS-T in NUTR are not required to fulfill the SF State Studies requirement.'
    - 'Nutrition and Dietetics Major – Concentration in Foods and Community Nutrition: 27-31 units. Core Requirements (includes
      University GWAR course): 24-27 units. CHEM 115, NUTR 253, and PSY 200 met before transfer. MATH 124 may have been met
      before transfer. Professional Requirement: 3 units. Electives: 0-2 units BIOL 210 and BIOL 211 met before transfer.
      BIOL 212, BIOL 213, and/or BIOL 220 may have been met before transfer.'
    - 'University Electives: 15 or more units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State - some courses may meet more than one requirement,
      e.g., in both UD GE and the major.'
    - '1: Major Electives - Select As Needed (0-2 units). A full list of courses that can fulfill this requirement can be
      found in the Degree Requirements (p. 682).'
