- id: complementary_studies
  unparsed: true
  quote: Twelve units of Complementary Studies are required of all candidates in any of the four concentrations (Literature,
    Linguistics, English Education, and Professional Writing and Rhetoric) in the Bachelor of Arts degree in English. These
    units must come from courses bearing a prefix other than ENG, and must not be cross-listed with ENG. English majors will
    be offered four pathways for satisfying this requirement; each pathway is designed to facilitate graduation in a timely
    manner.
  source: p.1137
- id: complementary_studies_pathways
  unparsed: true
  quote: '1. Foreign Language: 12 units in a single foreign language;

    2. Second major, minor, or certificate: 12 units of coursework taken as part of a second major, a minor, or a certificate;

    3. Study Abroad: 12 units of coursework taken in an approved study abroad program (such as CSU Study Abroad);

    4. Related Subjects: 12 units of coursework in related disciplines with the approval of an English Department advisor.

    For these related subjects, six units must be from classes in a non-literary related field.'
  source: p.1138
