- id: elective_eligibility
  unparsed: true
  source: p.1039
  quote: All upper-division COMM courses between COMM 400-599 may be used as electives only if their corresponding area above
    is already met with other courses. For example, if a student has completed 8 units of Rhetoric and Performance, they may
    take additional units in Rhetoric and Performance to apply towards the electives requirement. Only 2 units from a lower-division
    COMM class may count towards the electives requirement. The following courses can also be used to fulfill electives requirements.
