- id: complementary_studies
  unparsed: true
  quote: 'Students completing a Bachelor of Arts in Africana Studies must complete twelve units in complementary studies in
    courses bearing a prefix other than AFRS or courses cross-listed with AFRS. These units may be in 1. a language other
    than English; 2. one course from each AA S, AIS, LTNS, and RRS; 3. four courses from one prefix: AA S or AIS or LTNS or
    RRS; 4. a minor or certificate; 5. units earned in a study abroad program; or 6. a coherent group of courses complementary
    to the major. With the approval of an advisor in the major, courses that fulfill the complementary studies requirement
    may be lower or upper-division units, resident or transfer units.'
  source: p.403
