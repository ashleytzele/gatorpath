- id: complementary_studies
  title: Complementary Studies Requirement
  unparsed: true
  source: p.1154
  quote: 'Twelve units of Complementary Studies are required of all candidates in any of the four concentrations (Literature,
    Linguistics, English Education, and Professional Writing and Rhetoric) in the Bachelor of Arts degree in English. These
    units must come from courses bearing a prefix other than ENG and must not be cross-listed with ENG. English majors will
    be offered four pathways for satisfying this requirement; each pathway is designed to facilitate graduation in a timely
    manner. 1. Foreign Language: 12 units in a single foreign language; 2. Second Major, Minor, or Certificate: 12 units of
    coursework taken as part of a second major, a minor, or a certificate; 3. Study Abroad: 12 units of coursework taken in
    an approved study abroad program (such as CSU Study Abroad); 4. Related Subjects: 12 units of coursework in related disciplines
    with the approval of an English Department advisor. Related subjects typically include (but are not limited to) Comparative
    and World Literature, Classics, Creative Writing, Ethnic Studies, Foreign Languages, History, Journalism, and Women and
    Gender Studies, Communication Studies, Instructional Technology, or Marketing. For these related subjects, 6 units must
    be from classes in a non-literary-related field. Depending on the concentration within the major, Complementary Studies
    pathway, and approval of a departmental advisor, up to 12 units from courses with non-ENG prefixes that count towards
    the Complementary Studies requirement may also count as English electives in fulfillment of Major requirements.'
