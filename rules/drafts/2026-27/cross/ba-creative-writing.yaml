- id: course_prerequisites_and_order
  unparsed: true
  source: p.1061
  quote: Fundamentals of Creative Writing and Fundamentals of Creative Reading are prerequisites to all other Creative Writing
    courses. C W 302 is also a prerequisite to all upper-division English literature courses. C W 302 must be taken at SF
    State. Upon completion of C W 302, courses from Section G may be taken at any time. C W 301 and C W 302 may be taken concurrently.
