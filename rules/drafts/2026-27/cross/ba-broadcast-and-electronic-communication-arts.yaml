- id: focus_area_electives
  title: Electives in a Focus Area
  choose_units: 15
  from:
  - subject: BECA
    level: upper
  - approved: true
    max_units: 3
  approval: Upper-division BECA courses selected in consultation with a BECA faculty advisor.
  source: p.954
  quote: 'Electives in a Focus Area (15 units)

    Upper-division BECA courses selected in consultation with a BECA faculty advisor. Electives must be upper-division, may
    include Foundation Area courses in the Media Writing and Media, Culture, and Society areas not used to fulfill those requirements,
    and may include up to 3 units from other departments/programs.'
- id: supervised_independent_work_cap
  title: Supervised and Independent Work Experience units counted toward major
  max_units_from:
    list:
    - BECA 576
    - BECA 685
    - BECA 695
    - BECA 699
    units: 3
  across: major
  source: p.954
  quote: Students may count a total of 3 units combined from the courses BECA 576, BECA 685 , BECA 695 , and BECA 699 toward
    satisfying major requirements.
- id: california_community_college_transfer_cap
  title: California community college courses applied to major
  unparsed: true
  source: p.954
  quote: Up to 12 units of courses from California community colleges may be directly applied to fulfilling BECA major requirements.
transfer_notes:
- text: Students transferring to the BECA program from a California community college or other institution should strive to
    complete the SF State Lower Division Transfer Pattern.
  source: p.954
- text: Transfer students are encouraged to complete the equivalent of BECA 200 and one lower-division production course (BECA
    230, 240, or 246) before matriculation at SF State.
  source: p.954
- text: Many of the transfer equivalents to these courses are offered at California community colleges and can be verified
    via the Assist website (http://www.assist.org/) (www.assist.org (http://www.assist.org/)).
  source: p.954
- text: Please contact a faculty advisor if your course is not listed.
  source: p.954
