- id: complementary_studies
  title: Complementary Studies
  unparsed: true
  quote: 'Bachelor of Arts students must complete at least 12 units of Complementary Studies outside of the primary prefix
    for the major. (Note: Students may not use an alternate prefix that is cross-listed with the primary prefix for the major.)
    Students who complete two majors or a major and a minor automatically complete the Complementary Studies requirement.
    Additional ways to complete Complementary Studies for students in the Dance major include, with the approval of a Dance
    Program advisor, completing 12 units in a single foreign language of their choosing, 12 units from courses taken in a
    study abroad program, 12 units of courses taken as partial completion of a second major, minor or certificate, or 12 units
    of courses in related disciplines. Related disciplines typically include theater, music, cinema, broadcast and electronic
    communications, creative writing, journalism, kinesiology, physical education, health education, holistic health, biology,
    elementary education, English, history, anthropology, business, and journalism. The dance program allows up to 12 units
    of dance-related disciplines to count toward the dance major.'
  source: p.1677
transfer_notes:
- text: Before transfer, complete as many lower-division requirements or electives for this major as possible.
  source: p.1678
- text: The following courses are not required for admission but are required for graduation. Students are strongly encouraged
    to complete these units before transfer; doing so will provide more flexibility in course selection after transfer. •
    a course in U.S. History • a course in U.S. & California Government
  source: p.1678
- text: 'For information about satisfying the requirements described in (1) and (2) above at a California Community College
    (CCC), please visit http://www.assist.org (http://assist.org). Check any geographically accessible CCCs; sometimes, options
    include more than one college. Use ASSIST to determine: • Which courses at a CCC satisfy any lower-division major requirements
    for this major; • Which courses at a CCC satisfy CSU GE, US History, and US & CA Government requirements.'
  source: p.1678
- text: Before leaving the last California Community College of attendance, obtain a summary of completion of lower-division
    General Education units (IGETC or CSU GE Breadth). This is often referred to as a GE certification worksheet. SF State
    does not require delivery of this certification to Admissions, but students should retain this document for verifying
    degree progress after transfer.
  source: p.1678
