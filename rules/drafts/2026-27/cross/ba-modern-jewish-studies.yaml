- id: complementary_studies
  title: Complementary Studies
  unparsed: true
  quote: Twelve units of Complementary Studies are required of all candidates for the B.A. in Modern Jewish Studies. These
    units are courses with a prefix other than JS and not cross-listed with Jewish Studies. Students can satisfy this requirement
    by completing a related minor, a second major, studying a pertinent foreign language, including Hebrew, or through an
    approved study abroad program. Complementary Studies courses should relate to the Jewish Studies major and deepen and
    enrich students' focus in the major, whether that focus is religion, literature, philosophy, history, social responsibility,
    or the study of Israel. Such courses are typically found through the College of Liberal & Creative Arts.
  source: p.1357
