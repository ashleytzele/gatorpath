- id: complementary_studies
  title: Complementary Studies
  unparsed: true
  source: p.1450
  quote: 'Required of all candidates for the Bachelor of Arts degree in Chinese are 12 units of Complementary Studies, which
    must come from courses bearing a prefix other than CHIN, and not cross-listed with CHIN. Complementary Studies for the
    Chinese major can be satisfied via four possible routes: 1. 12 units in any foreign language other than Chinese (may include
    up to 3 units of MLL prefix courses); 2. 12 units of course work taken in an approved study abroad program (including
    CSU Study Abroad, SF State Bilateral, Chinese Flagship, and SLI Translation-Interpretation programs); 3. 12 units of course
    work taken as part of a second major, a minor or a certificate; 4. 12 units of course work in related disciplines with
    the approval of a Chinese Program advisor. Related disciplines typically include linguistics, literature, philosophy,
    history, education, and any aspect of Greater China, East Asia, or Asian Americans. Where a course with a non-CHIN prefix
    is taken as a core requirement or elective for the Chinese major, the said course may also (double) count towards Complementary
    Studies only via the Study Abroad option or the 2nd Major/Minor/Certificate option listed above. Students satisfying Complementary
    Studies through the Foreign Language option are allowed a maximum of three units of overlap of MLL prefix courses between
    Chinese major and Complementary Studies units. Students satisfying Complementary Studies through the Related Subjects
    option are not allowed to double-count major and Complementary Studies units.'
- id: study_abroad_units
  unparsed: true
  source: p.1450
  quote: 'NOTE: Regarding Study Abroad (applies to all Chinese degrees, concentrations, and minors): Students are encouraged
    to study abroad through the International Programs of the California State University and the Bilateral Programs of San
    Francisco State University. For students opting to study abroad, all study abroad units will count as units in residence
    and can be used for graduation credit, but no more than half of the units required for the major or minor may be taken
    outside of the home campus. Flagship Language Concentration students, however, may apply all of their Study Abroad units
    towards the major.'
transfer_notes:
- text: Before transfer, complete as many lower-division requirements or electives for this major as possible.
  source: p.1451
- text: The following courses are not required for admission but are required for graduation. Students are strongly encouraged
    to complete these units before transfer; doing so will provide more flexibility in course selection after transfer.
  source: p.1451
- text: a course in U.S. History
  source: p.1451
- text: a course in U.S. & California Government
  source: p.1451
- text: 'For information about satisfying the requirements described in (1) and (2) above at a California Community College
    (CCC), please visit http://www.assist.org (http://assist.org). Check any geographically accessible CCCs; sometimes, options
    include more than one college. Use ASSIST to determine:'
  source: p.1451
- text: Which courses at a CCC satisfy any lower-division major requirements for this major;
  source: p.1451
- text: Which courses at a CCC satisfy CSU GE, US History, and US & CA Government requirements.
  source: p.1451
- text: Remedial courses are not transferable and do not apply to the minimum 60 semester units/90 quarter units required
    for admission.
  source: p.1451
- text: Additional units for courses that are repeated do not apply to the minimum 60 units required for upper-division transfer
    (for example, if a course was not passed on the first attempt or was taken to earn a better grade).
  source: p.1451
- text: Before leaving the last California Community College of attendance, obtain a summary of completion of lower-division
    General Education units (IGETC or CSU GE Breadth). This is often referred to as a GE certification worksheet. SF State
    does not require delivery of this certification to Admissions, but students should retain this document for verifying
    degree progress after transfer.
  source: p.1451
- text: 'Credit for Advanced Placement, International Baccalaureate, or College-Level Examination Program courses: AP/IB/CLEP
    credit is not automatically transferred from the previous institution. Units are transferred only when an official score
    report is delivered to SF State. Credit is based on the academic year during which exams were taken. Refer to the University
    Bulletin in effect during the year of AP/IB/CLEP examination(s) for details regarding the award of credit for AP/IB/CLEP.'
  source: p.1451
- text: Students pursuing majors in science, technology, engineering, and mathematics (STEM) disciplines often defer 6-9 units
    of lower-division General Education in Areas C and D until after transfer to focus on preparation courses for the major.
    This advice does not apply to students pursuing associate degree completion before transfer.
  source: p.1451
- text: Review SF State's lower-division General Education requirements. Note that, as described below, the four basic skills
    courses required for admission meet GE Areas 1A/A2, 1B/A3, 1C/A1, and 2/B4 in the SF State GE pattern. Courses that fulfill
    the remaining areas of SF State’s lower-division GE pattern are available at most two-year and four-year colleges and
    universities.
  source: p.1451
- text: Of the four required basic skills courses, a course in critical thinking (1B/A3) may not be widely offered outside
    the CCC and CSU systems. Students should attempt to identify and take an appropriate course no later than the term of
    application to the CSU. To review more information about the 1B/A3 requirement, please visit bulletin.sfsu.edu/undergraduate-education/general-education/lower-division/#AAEL.
  source: p.1451
- text: Waiting until after transfer to take a single course at SF State that meets both US and CA/local government requirements
    may be an appropriate option, particularly if transferring from outside of California.
  source: p.1451
