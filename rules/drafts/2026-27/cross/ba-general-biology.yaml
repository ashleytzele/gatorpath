  quote: 'Upper-Division Electives (7-16 units)

    Students should take as many units as needed to reach a total of 58 units in the program. Elective courses can be additional
    courses listed above not used to satisfy requirements in those categories. Take a GWAR course if not already taken. Only
    one of the following courses can be used as an elective: BIOL 317, BIOL 327, BIOL 330, or BIOL 349. Up to 3 units of BIOL
    699 can also be used towards the total units.'
  footnote_quote: Classes can only account for 6 units of upper-division elective courses.
  footnote_source: p.1786
- id: major_gwar
