transfer_notes:
- text: No specific degree is required for admission as an upper-division student. However, the ADT includes specific guarantees
    related to admission and graduation and is designed to clarify the transfer process and strengthen lower-division preparation
    for the major.
  source: p.1611
- text: Students pursuing an ADT are guaranteed admission to the CSU if minimum eligibility requirements are met, though not
    necessarily to the CSU campus of primary choice.
  source: p.1611
- text: Upon verification that the ADT has been awarded prior to matriculation at SF State, students are guaranteed B.A. or
    B.S. completion in 60 units if pursuing a “similar” major after transfer. Determinations about “similar” majors at SF
    State are made by faculty in the discipline.
  source: p.1611
- text: Students who have earned an ADT should seek advising in the major department during the first semester of attendance.
  source: p.1612
- text: Before transfer, complete as many lower-division requirements or electives for this major as possible.
  source: p.1612
- text: 'For information about satisfying the requirements described in (1) and (2) above at a California Community College
    (CCC), please visit http://www.assist.org (http://assist.org). Check any geographically accessible CCCs; sometimes, options
    include more than one college. Use ASSIST to determine: Which courses at a CCC satisfy any lower-division major requirements
    for this major; Which courses at a CCC satisfy CSU GE, US History, and US & CA Government requirements.'
  source: p.1612
- text: The following courses are not required for admission but are required for graduation. Students are strongly encouraged
    to complete these units before transfer; doing so will provide more flexibility in course selection after transfer. •
    a course in U.S. History • a course in U.S. & California Government
  source: p.1612
