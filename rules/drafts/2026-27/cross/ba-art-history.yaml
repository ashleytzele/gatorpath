- id: lower_division_and_declaration_prerequisites
  unparsed: true
  quote: Before advancing to the 300-level or higher courses or declaring a concentration, all majors must have completed
    the University’s lower-division requirements and the lower-division courses for the major, or equivalent. Change of major
    students must also have proof of an art advisor consultation.
  source: p.910
