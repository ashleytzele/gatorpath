- id: major_letter_grade
  title: Letter Grades
  across: major
  letter_grade: true
  except:
  - S ED 640
  - S ED 660
  quote: All courses, including physical activity courses used to satisfy completion of major requirements, must be taken
    for a letter grade. No CR/NC grades may be used on the major petition for graduation with the exception of S ED 640 and
    S ED 660.
  source: p.724
- id: kinesiology_course_grades
  title: Grades in Kinesiology Courses
  unparsed: true
  quote: Students majoring in Integrated Teacher Education Program in Physical Education must earn a grade of C or higher
    in all required Kinesiology theory courses and a grade of B or higher in all movement-based courses.
  source: p.724
- id: credential_content_area_grade
  title: Physical Education Content Area Grades
  unparsed: true
  quote: Earn at least a C- in every Physical Education content areas course to meet the subject matter competency requirements
    for credentialing purposes.
  source: p.725
- id: activity_areas
  title: Activity Area Competence
  unparsed: true
  quote: Demonstrate an understanding of and possess demonstration-level skill competence in 12 activity areas. Students must
    pre-plan their routes to meet this requirement upon consultation with faculty and in conjunction with KIN 240.
  source: p.725
- id: required_experiences
  title: Additional Required Experiences
  unparsed: true
  quote: The following experiences are required for satisfactory completion of the Physical Education Subject Matter Preparation
    Program. Students may complete these experiences in courses available at a college, university, or off-campus. However,
    these experiences do not bear credit toward completion of the major. • Life Guard Training and Water Safety Instruction.
    • First Aid-CPR Certification. • Active participation in student CAHPERD, AAHPERD, and/or the Kinesiology Student Association,
    or other related professional organizations. • Gain experience in coaching, teaching physical education, recreation, or
    intramurals through working as a volunteer or paid assistant.
  source: p.725
