transfer_notes:
- text: Before transfer, complete as many lower-division requirements or electives for this major as possible.
  source: p.1372
- text: The following courses are not required for admission but are required for graduation. Students are strongly encouraged
    to complete these units before transfer; doing so will provide more flexibility in course selection after transfer.
  source: p.1372
- text: 'For information about satisfying the requirements described in (1) and (2) above at a California Community College
    (CCC), please visit http://www.assist.org (http://assist.org). Check any geographically accessible CCCs; sometimes options
    include more than one college. Use ASSIST to determine:'
  source: p.1372
- text: Which courses at a CCC satisfy any lower-division major requirements for this major;
  source: p.1372
- text: Which courses at a CCC satisfy CSU GE, US History, and US & CA Government requirements.
  source: p.1372
- text: 'Remedial courses are not transferable and do not apply to the minimum

    60 semester units/90 quarter units required for admission.

    Additional units for courses that are repeated do not apply to the

    minimum 60 units required for upper-division transfer (for example, if a

    course was not passed on the first attempt or was taken to earn a

    better grade).'
  source: p.1373
- text: 'Before leaving the last California Community College of attendance,

    obtain a summary of completion of lower-division General Education

    units (IGETC or CSU GE Breadth). This is often referred to as a GE

    certification worksheet. SF State does not require delivery of this

    certification to Admissions, but students should retain this document for

    verifying degree progress after transfer.'
  source: p.1373
- text: 'Credit for Advanced Placement, International Baccalaureate, or

    College-Level Examination Program courses: AP/IB/CLEP credit is

    not automatically transferred from the previous institution. Units are

    transferred only when an official score report is delivered to SF State.

    Credit is based on the academic year during which exams were taken.

    Refer to the University Bulletin in effect during the year of AP/IB/CLEP

    examination(s) for details regarding the award of credit for AP/IB/CLEP.'
  source: p.1373
- text: 'Students pursuing majors in science, technology, engineering, and

    mathematics (STEM) disciplines often defer 6-9 units of lower-division

    General Education in Areas C and D until after transfer to focus on

    preparation courses for the major. This advice does not apply to students

    pursuing associate degree completion before transfer.'
  source: p.1373
- text: 'Waiting until after transfer to take a single course at SF State that meets

    both US and CA/local government requirements may be an appropriate

    option, particularly if transferring from outside of California.'
  source: p.1373
