- id: complementary_studies
  title: Complementary Studies
  unparsed: true
  quote: 'Required of all candidates for the Bachelor of Arts degree in Chinese are 12 units of Complementary Studies, which
    must come from courses bearing a prefix other than CHIN, and not cross-listed with CHIN. Complementary Studies for the
    Chinese major can be satisfied via four possible routes:

    1. 12 units in any foreign language other than Chinese (may include up to 3 units of MLL prefix courses);

    2. 12 units of coursework taken in an approved study abroad program (including CSU Study Abroad, SF State Bilateral, Chinese
    Flagship, and SLI Translation-Interpretation programs);

    3. 12 units of coursework taken as part of a second major, a minor, or a certificate;

    4. 12 units of coursework in related disciplines with the approval of a Chinese Program advisor.

    Related disciplines typically include linguistics, literature, philosophy, history, education, and any aspect of greater
    China, East Asia, or Asian Americans.

    Where a course with a non-CHIN prefix is taken as a core requirement or elective for the Chinese major, the said course
    may also (double) count towards Complementary Studies only via the Study Abroad option or the second major/minor/certificate
    option listed above. Students satisfying Complementary Studies through the Foreign Language option are allowed a maximum
    of 3 units of overlap of MLL-prefix courses between the Chinese major and Complementary Studies units. Students satisfying
    Complementary Studies through the Related Subjects option are not allowed to double-count major and Complementary Studies
    units.'
  source: p.1444
transfer_notes:
- text: Before transfer, complete as many lower-division requirements or electives for this major as possible.
  source: p.1444
- text: The following courses are not required for admission but are required for graduation. Students are strongly encouraged
    to complete these units before transfer; doing so will provide more flexibility in course selection after transfer.
  source: p.1444
- text: 'For information about satisfying the requirements described in (1) and (2) above at a California Community College
    (CCC), please visit http://www.assist.org (http://assist.org). Check any geographically accessible CCCs; sometimes, options
    include more than one college. Use ASSIST to determine:

    • Which courses at a CCC satisfy any lower-division major requirements for this major;

    • Which courses at a CCC satisfy CSU GE, US History, and US & CA Government requirements.'
  source: p.1444-1445
