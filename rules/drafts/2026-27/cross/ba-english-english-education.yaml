- id: complementary_studies
  unparsed: true
  quote: 'Twelve units of Complementary Studies are required of all candidates in any of the four concentrations (Literature,
    Linguistics, English Education and Professional Writing and Rhetoric) in the Bachelor of Arts degree in English. These
    units must come from courses bearing a prefix other than ENG, and must not be cross-listed with ENG. English majors will
    be offered four pathways for satisfying this requirement; each pathway is designed to facilitate graduation in a timely
    manner.

    1. Foreign Language: 12 units in a single foreign language;

    2. 2nd Major, Minor, or Certificate: 12 units of coursework taken as part of a second major, a minor or a certificate;

    3. Study Abroad: 12 units of coursework taken in an approved study abroad program (such as CSU Study Abroad);

    4. Related Subjects: 12 units of coursework in related disciplines with the approval of an English Department advisor.

    Related subjects typically include (but are not limited to) Comparative and World Literature, Classics, Creative Writing,
    Ethnic Studies, Foreign Languages, History, Journalism, and Women and Gender Studies, Communication Studies, Instructional
    Technology, or Marketing. For these related subjects, six units must be from classes in a non-literary related field.

    Depending on the concentration within the major, Complementary Studies pathway, and approval of a departmental advisor,
    up to 12 units from courses with non-ENG prefixes that count towards the Complementary Studies requirement may also count
    as English electives in fulfillment of degree requirements.

    Students who have earned AA-T or AS-T degrees and are pursuing a similar B.A. degree at SF State are required to fulfill
    the Complementary Studies requirement as defined by the major department. Students should consult with a major advisor
    about how transfer units and/or SF State units can best be applied to this requirement in order to ensure degree completion
    within 60 units.'
  source: p.1122
- id: lower_division_credit_limit
  unparsed: true
  quote: A maximum of six units of lower-division coursework may be accepted for credit in the English major upon consent
    of an advisor. Advanced Placement (A.P.) credit in composition cannot be used to fulfill the six-unit lower-division requirement
    in the major.
  source: p.1121
