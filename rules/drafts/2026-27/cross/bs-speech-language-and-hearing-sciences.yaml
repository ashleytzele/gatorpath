- id: sequence_progression
  title: Sequence progression
  unparsed: true
  source: p.382
  quote: Successfully complete all courses in each semester sequence. Students who do not meet these criteria cannot take
    any additional courses in the sequence. Courses with less than a C– grade must be retaken before enrollment in the complete
    sequence may continue.
- id: advisor_meeting
