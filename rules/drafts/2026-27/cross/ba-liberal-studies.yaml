- id: electives
  title: Electives
  unparsed: true
  source: p.1403
  quote: 'Electives (12 units) Choose one of the following options, in consultation with an advisor: A. Complete at least
    12 units that are part of a minor, certificate, or another major on campus. Suggested minors include Education, Special
    Education, any minor in Ethnic Studies, American Studies, California Studies, Comics Studies, Counseling, Holistic Health,
    Health Education, Earth Sciences, Communication Studies, Modern Languages (Chinese, French, German, Italian, Japanese,
    Persian, Russian), Humanities, Math, History, Global Peace Studies, Criminal Justice Studies, and Women and Gender Studies.
    For double majoring, please consult a Liberal Studies adviser. B. Complete 12 units of additional courses (not already
    counted for the core) outlined in the Teacher Preparation Emphasis. See program website or adviser for a list of courses
    to choose from. C. In consultation with a Liberal Studies faculty advisor, design and complete a 12-unit elective pattern.

    '
- id: complementary_studies
  title: Complementary Studies
  unparsed: true
  source: p.1403
  quote: 'Required of all candidates for the Bachelor of Arts degree in Liberal Studies are 12 units of Complementary Studies,
    which must come from courses bearing a prefix other than LS, and not cross-listed with LS. Complementary Studies for the
    Liberal Studies major can be satisfied via four possible routes: • 12 units of a language • 12 units towards completion
    of a minor or 2nd major or certificate. • Any 12 units outside of LS prefix and not cross-listed with LS • Study Abroad
    Students who have earned AA-T or AS-T degrees and are pursuing a similar B.A. degree at SF State are required to fulfill
    the Complementary Studies requirement as defined by the major department.

    '
