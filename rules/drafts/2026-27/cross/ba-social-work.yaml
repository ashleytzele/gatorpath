- id: eligibility_requirements
  unparsed: true
  quote: Admission to the Bachelor of Arts in Social Work (BASW) major is limited to students at the upper-division (60 units
    or more). Applicants must be either a current SF State student or eligible for admission to undergraduate studies at San
    Francisco State University.
  source: p.830
- id: complementary_studies
  unparsed: true
  quote: 'Students completing a Bachelor of Arts in Social Work (B.A.S.W.) degree must complete 12 units in Complementary
    Studies in one of the following ways:

    1. 3 units of biology or sexuality studies, 3 units of psychology, 3 units of economics, and 3 units of sociology.

    2. 12 units of courses taken towards a certificate, a minor, or a second major in a related discipline.

    Students who have earned AA-T or AS-T degrees and are pursuing a BASW degree at SF State are required to fulfill the Complementary
    Studies requirement as defined by the School of Social Work. Students should consult with their social work advisor about
    how transfer units and/or SF State units can best be applied to this requirement to ensure degree completion within 60
    units.

    With the approval of an advisor in the major, courses that fulfill the Complementary Studies requirement may be lower
    or upper-division units, resident or transfer units.'
  source: p.831
- id: practicum_requirements
  unparsed: true
  quote: 'Practicum Internships: BASW students are required to complete 450 hours in an approved practicum internship site
    during their senior year. The Practicum Education Director and BASW Practicum Coordinator work closely with students to
    find internship placements. Before entering practicum internships, students must have completed 24 units of their junior
    year courses with a grade of C or better.'
  source: p.830
