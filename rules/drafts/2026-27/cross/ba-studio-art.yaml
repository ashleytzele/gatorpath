- id: lower_division_before_upper
  unparsed: true
  quote: Before advancing to the 300-level or higher courses or declaring a concentration, all majors must have completed
    the University's lower-division requirements and the lower-division courses for the major, or equivalent. Change of major
    students must also have proof of an art advisor consultation.
  source: p.926
- id: transfer_residence
  unparsed: true
  quote: For students transferring from other institutions, a minimum of 12 units in residence is required.
  source: p.926
- id: major_change_advising
  unparsed: true
  quote: Juniors or seniors who have declared another major, but wish to change their major to Studio Art must attend a major
    group advising session. Email sch_art@sfsu.edu for information and advising session dates.
  source: p.926
