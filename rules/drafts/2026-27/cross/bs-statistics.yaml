  quote: 'Guided Electives (9 units)

    Select three courses from one of the areas (Science, Economics, Business: Decision Sciences, or Business: Information
    Systems) listed below:

    Science

    Select three courses in consultation with a statistics advisor:

    MATH 370 Real Analysis I 3

    MATH 376 Ordinary Differential Equations I 3

    MATH 400 Numerical Analysis 3

    MATH 425 Applied and Computational Linear Algebra 3

    MATH 430 Mathematics of Optimization 3

    MATH 460 Mathematical Modeling 3

    Economics

    Select three courses in consultation with a statistics advisor:

    ECON 301 Intermediate Microeconomic Theory 3

    ECON 302 Intermediate Macroeconomic Theory 3

    ECON 312 Introduction to Econometrics 3

    ECON 715 Mathematical Economics 3

    ECON 731 Econometric Methods and Applications 3

    ECON 825 Applied Time Series Forecasting for Economics and Business 3

    Business: Decision Sciences

    Select three courses in consultation with a statistics advisor:

    DS 311 Technologies in Data Analytics 3

    DS 408 Simulation Modeling for Business 3

    DS 412 Operations Management 3

    DS 604 Business Forecasting 3

    DS 624 Quality Management 3

    Business: Information Systems

    Select three courses in consultation with a statistics advisor:

    ISYS 363 Information Systems for Management 3

    ISYS 463 Information Systems Analysis and Design 3

    ISYS 569 Information Systems for Business Process Management 3

    ISYS 650 Business Intelligence 3'
