  adt:
    title: Bachelor of Arts in Humanities – Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.1291-1292
    notes:
    - Suspended - Not Accepting New Majors
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an approved ADT. Three units in the major (Major Elective) and all lower-division GE requirements have been satisfied.
      Check with a major advisor about the most appropriate course sequence. Degree completion guaranteed in 60 units; see
      the Associate Degree for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not taken before transfer. Upper-Division GE Areas 2UD/5UD, 3UD, and 4UD
      (9 units): Courses required for the major may double-count if approved for Upper-Division GE. Students entering the
      major with the AA-T in Art History are not required to fulfill SF State Studies requirements.'
    - 'Humanities Major: 33 Units. Three units from the Art History AA-T may be applied to the Major Electives area. Core
      (15 units) – including a GWAR course. Major Electives (18 units) – Consult with a major advisor about applying units
      from the AA-T.'
    - 'University Electives: 15 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., both in UD GE and the major.'
    - '1: Major Electives (18 units). A full list of courses that can fulfill this requirement can be found in the Degree
      Requirements (p. 1285).'
    semesters:
