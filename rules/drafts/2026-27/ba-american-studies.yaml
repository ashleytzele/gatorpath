transfer_notes:
- text: No specific degree is required for admission as an upper-division student. However, the ADT includes specific guarantees
    related to admission and graduation and is designed to clarify the transfer process and strengthen lower-division preparation
    for the major.
  source: p.1265
- text: Students pursuing an ADT are guaranteed admission to the CSU if minimum eligibility requirements are met, though not
    necessarily to the CSU campus of primary choice.
  source: p.1265
- text: Students who have earned an ADT should seek advising in the major department during the first semester of attendance.
  source: p.1265
- text: Before transfer, complete as many lower-division requirements or electives for this major as possible.
  source: p.1265
- text: A course in U.S. History and a course in U.S. & California Government are not required for admission but are required
    for graduation; students are strongly encouraged to complete them before transfer.
  source: p.1265
- text: Use ASSIST (assist.org) to find which California Community College courses satisfy lower-division major requirements,
    CSU GE, US History, and US & CA Government.
  source: p.1265
- text: Remedial courses are not transferable and do not apply to the minimum 60 semester units/90 quarter units required
    for admission. Additional units for courses that are repeated do not apply to the minimum 60 units required for upper-division
    transfer.
  source: p.1265
- text: Before leaving the last California Community College of attendance, obtain a summary of completion of lower-division
    General Education units (IGETC or CSU GE Breadth), often called a GE certification worksheet, and retain it for verifying
    degree progress after transfer.
  source: p.1265
- text: AP/IB/CLEP credit is not automatically transferred from the previous institution. Units are transferred only when
    an official score report is delivered to SF State.
  source: p.1265
- text: Students pursuing STEM majors often defer 6-9 units of lower-division General Education in Areas C and D until after
    transfer to focus on preparation courses for the major. This advice does not apply to students pursuing associate degree
    completion before transfer.
  source: p.1265
- text: 'From outside CCCs and CSUs: the four basic skills courses required for admission meet GE Areas 1A/A2, 1B/A3, 1C/A1,
    and 2/B4. Critical thinking (1B/A3) may not be widely offered outside the CCC and CSU systems: identify and take an appropriate
    course no later than the term of application to the CSU. Waiting until after transfer to take a single SF State course
    that meets both US and CA/local government may be an option, particularly from outside California.'
  source: p.1266
