transfer_notes:
- text: Before transfer, complete as many lower-division requirements or electives for this major as possible.
  source: p.1014
- text: A course in U.S. History and a course in U.S. & California Government are not required for admission but are required
    for graduation; students are strongly encouraged to complete them before transfer.
  source: p.1014
- text: Use ASSIST (assist.org) to find which California Community College courses satisfy lower-division major requirements,
    CSU GE, US History, and US & CA Government.
  source: p.1014
- text: Remedial courses are not transferable and do not apply to the minimum 60 semester units / 90 quarter units required
    for admission. Additional units for repeated courses do not apply to the minimum 60 units required for upper-division
    transfer.
  source: p.1014
- text: Before leaving the last community college, obtain a summary of completed lower-division GE units (IGETC or CSU GE
    Breadth), the GE certification worksheet, and keep it for verifying degree progress after transfer.
  source: p.1014
- text: 'AP/IB/CLEP credit is not transferred automatically: units are awarded only when an official score report is delivered
    to SF State, under the Bulletin in effect the year of the exam.'
  source: p.1014
- text: STEM majors often defer 6-9 units of lower-division GE in Areas C and D until after transfer (not for students completing
    an associate degree before transfer).
  source: p.1015
- text: 'From outside CCCs and CSUs: the four basic skills courses required for admission meet GE Areas 1A/A2, 1B/A3, 1C/A1,
    and 2/B4. Critical thinking (1B/A3) may not be widely offered outside the CCC and CSU systems: identify and take an appropriate
    course no later than the term of application to the CSU. Waiting until after transfer to take a single SF State course
    that meets both US and CA/local government may be an option, particularly from outside California.'
  source: p.1015
