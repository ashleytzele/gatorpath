  adt:
    title: Bachelor of Science in Public Health – PHS Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.793-794
    met_in_transfer:
    - BIOL 100
    - BIOL 101
    - MATH 124
    - PH 205
    - PH 210
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AS-T in Public Health Science. Thirteen units in the major (BIOL 100, BIOL 101, MATH 124, PH 205, and PH 210) and
      all lower-division GE requirements have been satisfied. Additional units in the major may have been satisfied. Check
      with a major advisor about the most appropriate course sequence. Degree completion guaranteed in 60 units; see the Associate
      Degree for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not met pre-transfer. Upper-division GE (9 units): Courses required for the
      major may double-count if approved for UD GE. Students entering this major with the AS-T in Public Health are not required
      to fulfill the SF State Studies requirement.'
    - 'Public Health Major: 45 Units. BIOL 100, BIOL 101, MATH 124, and PH 205 met in transfer. Foundation (3 units): PH 100
      or BIOL 210. Core: 36 units. Electives: 6 units. PH 210 met in AS-T. Note: PH 221 equivalent may have been met in AS-T.'
    - 'University Electives: 3 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., UD GE and the major.'
    - 'Electives (6 units): A full list of courses that can fulfill this requirement can be found in the Degree Requirements
      (p. 788). (footnote 1)'
    semesters:
    - units: 15
