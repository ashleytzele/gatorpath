  adt:
    title: Bachelor of Arts in American Indian Studies – Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.426-427
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an approved ADT. All lower-division GE requirements have been satisfied. Check with a major advisor about the most appropriate
      course sequence. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section for more
      information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 3-12 units. American Institutions: Satisfied by courses required for the AIS core. Upper-Division
      GE (9 units): Courses required for the major may double-count if approved for UD GE. Students entering the major with
      an approved ADT are not required to fulfill SF State Studies requirements.'
    - 'American Indian Studies Major: 39 units. Core (21 units): Includes GWAR. Electives (18 units): Consult with a department
      advisor.'
    - 'University Electives: 12 or More Units. Units depend on course choices made at the community college, how transferred
      units are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., in both UD GE and the major.'
    - 1 Major Electives (18 units). A full list of courses that can fulfill this requirement can be found in the Degree Requirements
      (p. 421).
    - 'Associate Degrees for Transfer (ADTs) that are approved for the BA in American Indian Studies are: AA-T in American
      Indian Studies; AA-T in Anthropology; AS-T in Early Childhood Education; AA-T in Global Studies; AA-T in History; AA-T
      in Law, Public Policy, and Society; AA-T in Social Justice Studies; AA-T in Sociology.'
    semesters:
