  adt:
    title: 'Bachelor of Arts in Physics: Concentration in Astronomy – PHYS Associate Degree for Transfer (ADT) Roadmap'
    total_units: 60
    source: p.2181-2182
    met_in_transfer:
    - MATH 226
    - MATH 227
    - MATH 228
    - PHYS 220
    - PHYS 222
    - PHYS 230
    - PHYS 232
    - PHYS 240
    - PHYS 242
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AS-T in Physics. Twenty-four units in the major (MATH 226, MATH 227, MATH 228, PHYS 220, PHYS 222, PHYS 230, PHYS
      232, PHYS 240, and PHYS 242) and all lower-division GE requirements have been satisfied. Additional units in the major
      may have been satisfied. Check with a major advisor about the most appropriate course sequence. Degree completion guaranteed
      in 60 units; see the Associate Degree for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not taken before transfer. Upper-Division GE (9 units): Courses required
      for the major may double-count if approved for UD GE. Students entering the major with the AS-T in Physics are not required
      to fulfill the SF State Studies requirement. Complementary Studies is met in major with required mathematics.'
    - 'Physics B.A. (Astronomy) Major: 30 Units. MATH 226, MATH 227, MATH 228, PHYS 220, PHYS 222, PHYS 230, PHYS 232, PHYS
      240, and PHYS 242 met in transfer. Prerequisites (11 units). Upper-Division Requirements (11 units). Upper-Division
      Electives (6 units). Culminating Experience (2 units).'
    - 'University Electives: 15 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., both in UD GE and the major. Upper-division electives are recommended in order to meet the minimum 30-unit requirement.'
    - '1: Electives (6 units). Choose 6 units numbered 300-499 in PHYS and/or ASTR. With prior permission of a faculty major
      advisor, up to a maximum of 3 units may be taken in a related field outside of PHYS or ASTR.'
    semesters:
    - units: 14
      source: p.2181
      items:
      - ASTR 115
      - ASTR 116
      - slot: major
        group: ld_programming
        units: 3
        note: 'Select One (Major Prerequisite): CSC 309 or MATH 209'
      - MATH 245
      - PHYS 200
      - PHYS 320
    - units: 15
      source: p.2181
      items:
      - ASTR 300
      - ASTR 340GW
      - slot: major
        group: ud_electives
        units: 3
        note: Major Upper-Division Elective; footnote 1
      - slot: GE
        area: 5UD/2UD
        units: 3
        note: Upper-Division Sciences or Upper-Division Mathematical Concepts
      - slot: GE
        area: 3UD
        units: 3
        note: Upper-Division Arts or Humanities
    - units: 16
      source: p.2182
      items:
      - ASTR 301
      - slot: major
        group: culminating_experience
        units: 2
        note: 'Culminating Experience (Select 2 Units): ASTR 685, ASTR 697 or PHYS 686'
      - slot: major
        group: ud_electives
        units: 3
        note: Major Upper-Division Elective; footnote 1
      - slot: GE
        area: 4UD
        units: 3
        note: Upper-Division Social and Behavioral Sciences
      - slot: ai
        area: USG/CSLG
        units: 3
        note: US and California Government (p. 2351), or University Elective if met in transfer
      - slot: ai
        area: USH
        units: 3
        note: US History (p. 2350), or University Elective if met in transfer
    - units: 15
      source: p.2182
      items:
      - slot: elective
        units: 15
        note: University Electives - Take Five
