    title: Bachelor of Arts in Classics Roadmap
    total_units: 120
    source: p.1016-1017
    notes:
    - Suspended - Not Accepting New Students
    - 120 Total Units Required
    - 'Minimum Number of Units in the Major: 36'
    - This roadmap is a suggested plan of study and does not replace meeting with an advisor. Please note that students may
      need to adjust the actual sequence of courses based on course availability. Please consult your Degree Planner (https://registrar.sfsu.edu/degreeplanner)
      and an advisor for further guidance.
    - To avoid taking additional units, it is recommended that you meet the SF State Studies (AERM, GP, ESCA, SJ) requirements
      within your GE or major.
    - '1: Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 1A course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/)'
    - '2: Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 2 course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/)'
    - '3: Complementary Studies. Bachelor of Arts students must complete at least 12 units of Complementary Studies outside
      of the primary prefix for the major. (Note: Students may not use an alternate prefix that is cross-listed with the primary
      prefix for the major.) Students who complete two majors or a major and a minor automatically complete the Complementary
      Studies requirement. Additional ways to complete the CS requirement for students in the Classics major is to complete
      12 units in Greek (GRE (p. 2667)) or Latin (LATN (p. 2749)) or some combination of both.'
    - '4: First-time freshmen must take one lower-division Area 4 course that meets US History (USH).'
    - '5: Electives (18 Units). Select six elective courses, upon advisement, from CLAS (p. 2536), CLAR (p. 2534), GRE (p.
      2667), and LATN (p. 2749) prefixes, at least two of which must be upper-division. With the permission of an advisor,
      three electives can be taken in another department.'
    - '6: Consider taking a class combined with a laboratory or a separate lab to fulfill 5C if not already satisfied.'
    - '7: Survey (9 units). A full list of courses that can fulfill this requirement can be found in the Degree Requirements
      (p. 1013).'
    - '* Culminating Experience. All undergraduate students will complete a culminating experience project with one of the
      following components: A demonstration of oral and written skills in Latin and/or Greek. This demonstration has three
      parts: oral declamation of a prose passage; written transcription of a prose passage dictated by a test administrator;
      and oral declamation of passage of poetry (scansion) in dactylic hexameter. A comprehensive reflective statement focused
      on the role that receiving a Classical education at SF State has and will play in the student’s life. A display of the
      student’s best projects from their Classics coursework (e.g. term papers, translations, archaeological reconstructions).
      These components may be fulfilled through in-person meetings with a Classics undergraduate advisor, but students wishing
      to develop and display information competency are encouraged to complete these components in electronic form (website,
      etc.).'
