  adt:
    title: Bachelor of Arts in Classics - HIST Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.1018-1019
    notes:
    - Suspended - Not Accepting New Students
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AA-T in History. All lower-division GE requirements have been satisfied. Check with a major advisor about the most
      appropriate course sequence. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section
      for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-12 Units. American Institutions (0-3 units): US Government, California State and Local
      Government requirements if not taken before transfer. US History completed in ADT. Upper-Division GE Areas 2UD/5UD,
      3UD, and 4UD (9 units): Courses required for the major may double-count if approved for UD GE. Students entering this
      major with the AA-T in History are not required to fulfill SF State Studies requirements. Complementary Studies: Consult
      with a department advisor on how transfer units and SF State units can be applied to ensure degree completion within
      60 units.'
    - 'Classics Major: 36 Units. Discovery (6 units) - Select two lower-division courses from CLAR, CLAS, GRE, and LATN prefixes.
      Survey (9 units). GWAR (3 units) - A GWAR course in another department upon advisement. Electives (18 units). Culminating
      Experience (0 units) - See below.'
    - 'University Electives: 12 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., both in UD GE and the major.'
    - '1: Electives (18 Units). Select six elective courses, upon advisement, from CLAS (p. 2536), CLAR (p. 2534), GRE (p.
      2667), and LATN (p. 2749) prefixes, at least two of which must be upper-division. With the permission of an advisor,
      three electives can be taken in another department.'
    - '2: Survey (9 units). A full list of courses that can fulfill this requirement can be found in the Degree Requirements
      (p. 1013).'
    - '* Culminating Experience. All undergraduate students will complete a culminating experience project with one of the
      following components: A demonstration of oral and written skills in Latin and/or Greek. This demonstration has three
      parts: oral declamation of a prose passage; written transcription of a prose passage dictated by a test administrator;
      and oral declamation of passage of poetry (scansion) in dactylic hexameter. A comprehensive reflective statement focused
      on the role that receiving a Classical education at SF State has and will play in the student’s life. A display of the
      student’s best projects from their Classics coursework (e.g. term papers, translations, archaeological reconstructions).
      These components may be fulfilled through in-person meetings with a Classics undergraduate advisor, but students wishing
      to develop and display information competency are encouraged to complete these components in electronic form (website,
      etc.).'
