  adt:
    title: 'Bachelor of Science in Biology: Concentration in Ecology, Evolution, and Conservation Biology – BIOL Associate
      Degree for Transfer (ADT) Roadmap'
    total_units: 60
    source: p.1813-1814
    met_in_transfer:
    - BIOL 230
    - BIOL 240
    - CHEM 115
    - MATH 226
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AS-T in Biology. Twenty-three units in the major (BIOL 230, BIOL 240, CHEM 115, MATH 226, and the required PHYS sequence)
      and 33 units of lower-division GE requirements have been satisfied. Check with a major advisor about the most appropriate
      course sequence. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section for more
      information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 15-21 Units. American Institutions (0-6 units): US History, US Government, CA Government.
      Lower-Division GE (6 units) – Area 3 (3 units in any subarea) and Area 4 (3 units). Upper-Division GE Areas 2UD/5UD,
      3UD, and 4UD (9 units): Courses required for the major may double-count if approved for UD GE. Students entering this
      major with the AS-T in Biology are not required to fulfill the SF State Studies requirement.'
    - 'Biology – Ecology, Evolution, and Conservation Biology Major: 36 Units. Completed: BIOL 230, BIOL 240, CHEM 115, MATH
      226, and PHYS sequence. Lower-Division Requirements (8 units); Major Upper-Division Requirements/GWAR (23-25 units);
      Upper-Division Electives (3-5 units).'
    - 'University Electives: 7 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., both in UD, GE, and the major.'
    - '1: Area 5UD (Upper-Division Science) is satisfied upon completion of BIOL 355.'
    - '2: Field Elective (3-5 units). A full list of courses that can fulfill this requirement can be found in the Degree
      Requirements (p. 1805).'
    - '3: Upper-Division Electives (3-5 units). A full list of courses that can fulfill this requirement can be found in the
      Degree Requirements (p. 1805).'
    semesters:
    - units: 14
      source: p.1813
      items:
      - BIOL 231
      - BIOL 355
      - BIOL 482
      - CHEM 215
      - slot: GE
        area: '4'
        units: 3
    - units: 15
      source: p.1813
      items:
      - BIOL 337
      - BIOL 483GW
      - slot: major
        group: ld_organic_chemistry
        units: 3
        note: 'Select One (Major Lower-Division Core): CHEM 130 or CHEM 233'
      - slot: GE
        area: '3'
        units: 3
      - slot: GE
        area: 3UD
        units: 3
    - units: 15
      source: p.1813-1814
      items:
      - BIOL 458
      - BIOL 530
      - slot: major
        group: ud_field_course
        units: 5
        note: Field Elective - Select One (3-5 units); footnote 2
      - slot: GE
        area: 4UD
        units: 3
    - units: 16
      source: p.1814
      items:
      - slot: major
        group: ud_lecture_electives
        units: 3
        note: Upper-Division Electives (3-5 units); footnote 3
      - slot: ai
        area: USG/CSLG
        units: 3
        note: or University Elective if met in transfer
      - slot: ai
