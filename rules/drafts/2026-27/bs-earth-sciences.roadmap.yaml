  adt:
    title: 'Bachelor of Science in Earth Sciences: Geology Emphasis – GEOL Associate Degree for Transfer (ADT) Roadmap'
    total_units: 60
    source: p.2042-2043
    met_in_transfer:
    - CHEM 115
    - MATH 226
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AS-T in Geology. Twenty-three units in the major (CHEM 115, MATH 226, the Introduction to Earth Sciences requirement,
      and 3 units of Focus Electives) and all lower-division GE requirements have been satisfied. Additional units in the
      major may have been satisfied. Check with a major advisor about the most appropriate course sequence. Degree completion
      guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not taken before transfer. Upper-Division GE Areas 2UD/5UD, 3UD, and 4UD
      (9 units): Courses required for the major may double-count if approved for UD GE. Students transferring with the AS-T
      in Geology are not required to fulfill SF State Studies.'
    - 'Earth Sciences Major: 41-47 units. CHEM 115, MATH 226, the Introduction to Earth Sciences requirement, and 3 units
      of Focus Electives met in transfer. Basic Science & Math Foundation (4 units in PHYS): If some or all PHYS completed
      before transfer, consult with a major advisor about appropriate course choices. Introductory Methods (5-6 units). Earth
      Systems (10-11 units). Techniques in Earth Science Electives (6-8 units). Earth Science Focus Electives (12 units):
      Three units met in transfer. Culminating Experience (4-6 units): Take ERTH 690 (1 unit) or ENV 690 (3 units) along with
      one of the following three options: Senior Thesis (ERTH 697/ERTH 698 (2 units each); Senior Project (ERTH 695, 2 units
      required); or Geographic Internship (GEOG 688, 2 units required)'
    - 'University Electives: 0 or more units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, Culminating Experience option selected, and course choices at SF State - some
      courses may meet more than one requirement, e.g., both in UD GE and in the major.'
    - Earth Science Focus Electives (12 units minimum). A full list of courses that can fulfill this requirement can be found
      in the Degree Requirements (p. 2034). (footnote 1)
    - Techniques in Earth Science (6-8 units). A full list of courses that can fulfill this requirement can be found in the
      Degree Requirements (p. 2034). (footnote 2)
    semesters:
    - units: 14
      source: p.2042
      items:
      - slot: major
        group: systems_select_one
        units: 3
        note: Select One (Earth Systems); 3-4 units
      - ERTH 442
      - slot: major
        group: foundation_physics
        units: 4
        note: Select One Set of Courses (Science and Math Foundation; GE 5A, GE 5C)
      - slot: major
        group: focus_electives
        units: 3
        note: Earth Science Focus Elective; footnote 1
    - units: 14
      source: p.2042-2043
      items:
      - slot: major
        group: methods_select_one
        units: 2
        note: Select One (Introductory Methods); 2-3 units
      - ERTH 500
      - ENV 500GW
      - slot: major
        group: techniques_electives
        units: 3
        note: Techniques in Earth Science, 3-4 units; footnote 2
      - slot: GE
        area: 3UD
        units: 3
    - units: 16
      source: p.2043
      items:
      - slot: major
        group: capstone_presentation
        units: 1
        note: 'Select One (Capstone): ERTH 690 or ENV 690; 1-3 units'
      - slot: major
        group: focus_electives
        count: 2
        units: 6
        note: Earth Science Focus Elective - Take Two, 6-8 units; footnote 1
      - slot: major
        group: techniques_electives
        units: 3
        note: Techniques in Earth Science, 3-4 units; footnote 2
      - slot: GE
        area: 4UD
        units: 3
      - slot: elective
        units: 3
        note: University Elective (if needed to reach 60 units), 0-3 units
    - units: 16
      source: p.2043
      items:
      - slot: major
        group: capstone_project
        units: 2
        note: 'Select One (Capstone): ERTH 695, ERTH 697 & ERTH 698, or GEOG 688; 2-4 units'
      - slot: major
        group: focus_electives
        units: 3
        note: Earth Science Focus Elective, 3-4 units; footnote 1
      - slot: GE
        area: 5UD/2UD
        units: 3
      - slot: ai
        area: USH
        units: 3
        note: US History, or University Elective if US History met before transfer
      - slot: ai
        area: USG/CSLG
        units: 3
        note: US and California Government, or University Elective if US/CA Government met before transfer
      - slot: elective
        units: 2
        note: University Elective (if needed to reach 60 units), 0-2 units
