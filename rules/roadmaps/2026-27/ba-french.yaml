    - This roadmap is a suggested plan of study and does not replace meeting with an advisor. Please note that students may
      need to adjust the actual sequence of courses based on course availability. Please consult your Degree Planner (https://registrar.sfsu.edu/degreeplanner)
      and an advisor for further guidance.
    - To avoid taking additional units, it is recommended that you meet the SF State Studies (AERM, GP, ESCA, SJ) requirements
      within your GE or major.
    - '1: Lower-Division Requirements. Depending on prior language experience, students in the BA French program may place
      out of one or more lower-division French courses or receive credit for one or more lower-division courses. Students
      may receive credit for courses through transfer or courses from another institution or Advanced Placement test scores.
      The Placement Test in French can be taken via ilearn - please consult your advisor for further details. There are 45
      questions in the online test: A grade above 40 = Student should enroll in courses beyond the prerequisites. A grade
      above 30 = Student should enroll in FR 216. A grade above 20 = Student should enroll in FR 215. A grade above 10 = Student
      should enroll in FR 102. A grade less than 10 = Student should enroll in FR 101.'
    - '2: Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 1A course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/)'
    - '3: First-time freshmen must take one lower-division Area 4 course that meets US History (USH).'
    - '4: Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 2 course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/)'
    - '5: Consider taking a class combined with a laboratory or a separate lab to fulfill 5C if not already satisfied.'
    - '6: French Electives (6-9 units). Select enough upper-division FR courses not taken to satisfy an upper-division requirement
      to meet the minimum units required for the major. Any additional courses taken in the requirement categories count as
      electives once the requirement is satisfied.'
    - '7: In order to fulfill the GWAR Requirement, French Majors are encouraged to take FR 400GW (if not taken to fulfill
      the upper-division requirements), MLL 400GW, or CWL 400GW, yet any GWAR course taken in the college of LCA will satisfy
      the requirement.'
