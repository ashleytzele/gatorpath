  adt:
    title: Bachelor of Arts in Journalism – JOUR Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.1384-1385
    met_in_transfer:
    - JOUR 221
    notes:
    - This is a sample roadmap for students who transfer to San Francisco State University in the current Bulletin year with
      an AA-T in Journalism. Three units in the major (JOUR 221) and all lower-division GE requirements have been satisfied.
      Check with a major advisor about the most appropriate course sequence. Degree completion guaranteed in 60 units; see
      the Associate Degree for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not completed prior to transfer. Upper-Division GE Areas 2UD/5UD, 3UD, and
      4UD (9 units): Courses required for the major may double-count if approved for UD GE. Students entering this major with
      an approved ADT are not required to fulfill SF State Studies requirements. Complementary Studies: Consult with a department
      advisor on how transfer units and/or SF State units can be applied to ensure degree completion within 60 units.'
    - 'Journalism Major: 36 Units. JOUR 221 met in transfer. Core: Equity (12 units); Core: Skills (9 units); Advanced Courses
      (6 units); Electives (3 units); Practicum (3 units); Capstone (3 units).'
    - 'University Electives: 0 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State - some courses may meet more than one requirement,
      e.g., UD GE and the major.'
    - 'Minor or Certificate (12-28 units): A Journalism major must complete a minor or certificate (12-unit minimum) alongside
      their bachelor''s degree. Completion requires students to maintain a GPA of 2.0 or higher. Students should consult with
      an academic adviser in Journalism to determine a minor or certificate that meets their interests and professional goals.
