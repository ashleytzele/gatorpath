  first-time:
    title: Bachelor of Arts in Journalism Roadmap
    total_units: 120
    source: p.1381-1382
    notes:
    - This roadmap is a suggested plan of study and does not replace meeting with an advisor. Please note that students may
      need to adjust the actual sequence of courses based on course availability. Please consult your Degree Planner (https://registrar.sfsu.edu/degreeplanner)
      and an advisor for further guidance.
    - To avoid taking additional units, it is recommended that you meet the SF State Studies (AERM, GP, ESCA, SJ) requirements
      within your GE or major.
    - Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 1A course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/) (footnote 1)
    - First-time freshmen must take one lower-division Area 4 course that meets US History (USH). (footnote 2)
    - 'Complementary Studies: Students completing the Bachelor of Arts in Journalism must complete a minor or certificate
      (12-unit minimum) to fulfill the Complementary Studies Requirement. (footnote 3)'
    - 'Minor or Certificate (12-28 units): A Journalism major must complete a minor or certificate (12-unit minimum) alongside
      their bachelor''s degree. Completion requires students to maintain a GPA of 2.0 or higher. Students should consult with
      an academic adviser in Journalism to determine a minor or certificate that meets their interests and professional goals.
      Please see the specific minor page in this bulletin for information about requirements. (footnote 4)'
    - Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 2 course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/) (footnote 5)
    - Consider taking a class combined with a laboratory or a separate lab to fulfill B3 if not already satisfied. (footnote
      6)
    - 'Writing (3 units): A full list of courses that can fulfill this requirement can be found in the Degree Requirements
      (p. 1378). (footnote 7)'
    - 'Elective (3 units): A full list of courses that can fulfill this requirement can be found in the Degree Requirements
