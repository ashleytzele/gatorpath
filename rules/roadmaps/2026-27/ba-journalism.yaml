    - 'Elective (3 units): A full list of courses that can fulfill this requirement can be found in the Degree Requirements
      (p. 1378). (footnote 3)'
    - 'Senior Capstone (3 units): A full list of courses that can fulfill this requirement can be found in the Degree Requirements
      (p. 1378). (footnote 4)'
