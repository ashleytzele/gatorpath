  adt:
    title: Bachelor of Arts in Creative Writing – ENGL Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.1068-1069
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AA-T in English. Up to 3 units in the major and all lower-division GE requirements have been satisfied. Check with
      a major advisor about the most appropriate course sequence. Degree completion guaranteed in 60 units; see the Associate
      Degree for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not taken before transfer. Upper-Division GE Areas 2UD/5UD, 3UD, 4UD (9 units):
      Check for courses in the major that also satisfy Upper-Division GE. Students entering this major with the AA-T in English
      are not required to fulfill SF State Studies requirements. Complementary Studies: consult with a department advisor
      on how transfer units and/or SF State units can be applied to ensure degree completion within 60 units.'
    - 'Creative Writing Major: 39-42 Units. Check with a department advisor to see if 3 lower-division units from ADT can
      be applied to the major. Fundamentals (3-6 units): C W 301 and C W 302. Craft (3 units): C W 511GW or C W 512GW or C
      W 513GW, taken after fundamentals and before workshop. Creative Process Area and/or Workshop Areas (12 units). Variable
      Topics (3 units): C W 510 or C W 600. Major Revision (3 units): C W 606. Courses in Literature (12 units). Capstone
      Course (3 units): C W 601 – must be taken in last year.'
    - 'University Electives: 3 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., in both UD GE and the major.'
    - '1: Literature - 12 units. A full list of courses that can fulfill this requirement can be found in the Degree Requirements
      (p. 1061).'
    - '2: Creative Process Area and/or Workshop Area - 12 units. A full list of courses that can fulfill this requirement
      can be found in the Degree Requirements (p. 1061).'
