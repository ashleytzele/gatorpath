  adt:
    title: Bachelor of Arts in Environmental Studies Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.2025-2026
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AS-T in Environmental Science. Eight units in the major (CHEM 115 or CHEM 180, and ERTH 230 or GEOG 101) and all
      lower-division GE requirements have been satisfied. Check with a major advisor about the most appropriate course sequence.
      Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section for more information (p.
      2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government, if not taken before transfer. Upper-Division GE Areas 2UD/5UD, 3UD, and 4UD (9 units) –
      Upper-division GE (9 units): Courses required for the major may double-count if approved for UD GE. Students entering
      the major with the AS-T in ENVS are not required to fulfill SF State Studies requirements.'
    - 'Environmental Studies major: 35-42 units. Core (18-22 units) - CHEM 115 or CHEM 180 met in ADT. Core Electives (6-8
      units) – one course from two categories (Physical Environment met in ADT: ERTH 230 or GEOG 101). Guided Electives (11-12
      units).'
    - 'University Electives: 7 or more units'
    - Units depend on course choices made at the community college, how transferred units are applied to the requirements
      above, and course choices at SF State - some courses may meet more than one requirement, e.g., in both UD GE and the
      major.
    - 'Footnote 1: Guided Electives (11-12 units). A full list of courses that can fulfill this requirement can be found in
      the Degree Requirements (p. 2019).'
    - 'Footnote 2: Global/International. A full list of courses that can fulfill this requirement can be found in the Degree
      Requirements (p. 2019).'
    - 'Footnote 3: Sustainability and Social Justice. A full list of courses that can fulfill this requirement can be found
      in the Degree Requirements (p. 2019).'
