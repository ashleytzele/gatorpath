    - 'Footnote 3: First-time freshmen must take one lower-division Area 4 course that meets US History (USH).'
    - 'Footnote 4: Consider taking a class combined with a laboratory or a separate lab to fulfill 5C if not already satisfied.'
    - 'Footnote 5: Sustainability and Social Justice. A full list of courses that can fulfill this requirement can be found
      in the Degree Requirements (p. 2019).'
    - 'Footnote 6: Global/International. A full list of courses that can fulfill this requirement can be found in the Degree
      Requirements (p. 2019).'
    - 'Footnote 7: Guided Electives (11-12 units). A full list of courses that can fulfill this requirement can be found in
