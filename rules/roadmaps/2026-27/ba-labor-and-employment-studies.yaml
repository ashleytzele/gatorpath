  adt:
    title: Bachelor of Arts in Labor and Employment Studies - LPPS Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.258-259
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AA-T in Law, Public Policy and Society. All lower-division GE requirements have been satisfied. Check with a major
      advisor about the most appropriate course sequence. Degree completion guaranteed in 60 units; see the Associate Degree
      for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9 Units. American Institutions (0 units): The AA-T in Law, Public Policy, and Society
      Core includes courses that satisfy this requirement. Upper-Division GE (9 units): Courses required for the major may
      double-count if approved for UD GE. Students entering the major with the AA-T in Law, Public Policy, and Society are
      not required to fulfill SF State Studies requirements. Complementary Studies: Consult with a department advisor on how
      transfer units and/or SF State units can be applied to ensure degree completion within 60 units.'
    - 'Labor and Employment Studies Major: 39-40 Units. Required Courses (18 units). GWAR (3 units) - HIST 300GW. Elective
      Courses (15 units) – Upper-division LABR courses or cross-listed with LABR not used to satisfy core requirements can
      be used as electives. Final Experience (3-4 units) Internship or Final Research Project.'
    - 'University Electives: 12 Units or More. Units depend on course choices made at the community college, how transferred
      units are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., both in UD GE and the major.'
    - '1: Related Electives (15 units). Upper-division LABR courses or cross-listed with LABR not used to satisfy core requirements
      can be used as electives.'
