    - '2: Complementary Studies (12 Units). Bachelor of Arts students must complete at least 12 units of Complementary Studies
      outside of the primary prefix for the major. (Note: Students may not use an alternate prefix that is cross-listed with
      the primary prefix for the major.) Students who complete two majors or a major and a minor automatically complete the
      Complementary Studies requirement. An additional way to complete Complementary Studies for students in the Labor and
      Employment Studies major is to count the 12 Complementary Studies units toward elective units in the major. Consult
      with your major advisor for assistance.'
    - '3: Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
