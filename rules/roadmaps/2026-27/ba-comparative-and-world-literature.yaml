  adt:
    title: Bachelor of Arts in Comparative and World Literature – ENGL or SPAN Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.1283-1284
    notes:
    - Discontinued - Not Accepting New Students
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      the AA-T in English OR the AA-T in Spanish. Up to 12 lower-division units in the major and all lower-division GE requirements
      have been satisfied. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section for
      more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not taken before transfer. Upper-Division GE Areas 2UD/5UD, 3UD, and 4UD
      (9 units): Courses required for the major may double-count if approved for UD GE. Students entering the major with the
      AA-T in English or Spanish are not required to fulfill SF State Studies requirements.'
    - 'Comparative and World Literature Major: 27-36 Units. See department advisor regarding how to apply ADT units to the
      degree. Up to 12 literature and up to 3 Spanish language units may be applied. Major Core Courses/GWAR (18-21 units):
      Up to 3 units from the ADT (literature) may be applied if approved. Program Electives (6-15 units): Select in consultation
      with a department advisor. Up to 9 units from the ADT may be applied if approved.'
    - 'Note: Students may follow one of two advising pathways: Comparative Literature or World Literature. Consult with a
      department advisor.'
    - 'University Electives: 9 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., in both UD GE and the major.'
    - 'Program Electives (15 Units): In consultation with departmental advisors, students select literature courses that reflect
      their chosen advising pathway. These courses may be CWL courses not used to fulfill the core, HUM courses, or courses
      from departments other than CWL. No more than two lower-division courses may be used for electives. (footnote 1)'
