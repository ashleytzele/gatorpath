  adt:
    title: Bachelor of Arts in Theatre Arts – THA Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.1686-1687
    met_in_transfer:
    - TH A 132
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      the AA-T in Theatre Arts. Three lower-division units in the major (TH A 132) and all lower-division GE requirements
      have been satisfied. Additional units in the major may have been satisfied. Check with a major advisor about the most
      appropriate course sequence. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section
      for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 units. American Institutions (0-6 units): US History, US Government, and California
      State and Local Government requirements if not taken before transfer. Upper-Division GE Areas 2UD/5UD, 3UD, and 4UD
      (9 units): Courses required for the major may double-count if approved for UD GE. Students entering the major with the
      AA-T in Theatre Arts are not required to fulfill SF State Studies requirements.'
    - 'Drama (Theatre Arts) Major: 42 units. TH A 132 met before transfer - required for ADT. Core (24 units). Major Electives
      (15 units) – 15 elective units with the TH A prefix. At least 9 units must be upper-division units. Consult with a major
      advisor. Advanced Topics in Theatre Studies (3 units).'
    - 'University Electives: 3 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., in both UD GE and the major.'
    - 'Major Electives (15 units): The Bachelor of Arts in Theatre Arts requires 15 elective units with the TH A prefix. At
