    - 120 Total Units Required
    - 'Minimum Number of Units in the Major: 45'
    - This roadmap is a suggested plan of study and does not replace meeting with an advisor. Please note that students may
      need to adjust the actual sequence of courses based on course availability. Please consult your Degree Planner (https://registrar.sfsu.edu/degreeplanner)
      and an advisor for further guidance.
    - To avoid taking additional units, it is recommended that you meet the SF State Studies (AERM, GP, ESCA, SJ) requirements
      within your GE or major.
    - '1: Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 1A course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/)'
    - '2: First-time freshmen must take one lower-division Area 4 course that meets US History (USH).'
    - '3: Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 2 course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/)'
    - '4: Consider taking a class combined with a laboratory or a separate lab to fulfill 5C if not already satisfied.'
    - '5: Foundation Areas (9 units). A full list of courses that can fulfill this requirement can be found in the Degree
      Requirements (p. 954).'
    - '6: Electives in a Focus Area (15 units). Upper-division BECA courses selected in consultation with a BECA faculty advisor.
      Electives must be upper-division, may include Foundation Area courses in the Media Writing and Media, Culture, and Society
      areas not used to fulfill those requirements, and may include up to 3 units from other departments/programs.'
    - 'Focus Areas: Focus areas do not appear on the B.A. diploma and do not require any particular set of courses to be taken.
      They are advisory and are meant to provide guidance for students so they develop extensive knowledge or expertise in
      one subject area. Students should meet each semester with a faculty advisor who teaches in the relevant focus area to
      discuss the content of courses/course sequences offered and to plan for future semesters.'
    - 'The focus areas within BECA are: Audio Production; Radio and Podcasting; Video Production; Media Writing; Audio/Video
      News and Documentary; Media, Culture, and Society; and The Business of Media.'
