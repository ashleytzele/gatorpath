  adt:
    title: Bachelor of Arts in Broadcast and Electronic Communication Arts – FTVE Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.959-960
    met_in_transfer:
    - BECA 200
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AS-T in Film, Television, and Electronic Media. Six units in the major (BECA 200 and BECA 231/BECA 241/BECA 246)
      and all lower-division GE requirements have been satisfied. Additional units in the major may have been satisfied. Check
      with a major advisor about the most appropriate course sequence. Degree completion guaranteed in 60 units; see the Associate
      Degree for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (6 units): US History, US Government, California State
      and Local Government requirements if not taken before transfer. Upper-Division GE Areas 2UD/5UD, 3UD, and 4UD (9 units):
      Courses required for the major may double-count if approved for UD GE. Students entering this major with the AS-T in
      Film, Television, Video, and Electronic Media are not required to fulfill SF State Studies requirements.'
    - 'BECA Major: 30 Units. BECA 200 and BECA 231/BECA 241/BECA 246 met in transfer. Core/GWAR (9 units). Core Foundation
      (6 units): Media Production Area fulfilled by TV Studio Production course taken in AS-T. Electives in a Focus Area (15
      units): Must be upper-division courses; approval of BECA faculty advisor required.'
    - 'University Electives: 15 or More Units. Units depending on course choices made at the community college, how transferred
      units are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., in both UD GE and the major.'
    - '1: Foundation Areas (6 units). A full list of courses that can fulfill this requirement can be found in the Degree
      Requirements (p. 954).'
    - '2: Electives in a Focus Area (15 units). Upper-division BECA courses selected in consultation with a BECA faculty advisor.
      Electives must be upper-division, may include Foundation Area courses in the Media Writing and Media, Culture, and Society
      areas not used to fulfill those requirements, and may include up to 3 units from other departments/programs.'
    - 'Focus Areas: Focus areas do not appear on the B.A. diploma and do not require any particular set of courses to be taken.
