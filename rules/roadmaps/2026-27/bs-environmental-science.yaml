  adt:
    title: Bachelor of Science in Environmental Science – ENVS Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.2056-2057
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AS-T in Environmental Science. Twenty-six units in the major [BIOL and PHYS requirements; CHEM 115 or CHEM 180; GEOG
      101; GEOG 160; MATH 197/MATH 198 or MATH 199; MATH 226] and 33 units of lower-division GE have been satisfied. Check
      with a major advisor about the most appropriate course sequence. Degree completion guaranteed in 60 units; see the Associate
      Degree for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 15-21 units. American Institutions (0-6 units): US History, US Government, CA Government.
      Lower-Division GE (6 units) – Area 3 (3 units in any subarea) and Area 4 (3 units). Upper-Division GE (9 units): Courses
      required for the major and American Institutions may double-count if approved for UD GE. Students entering the major
      with the AS-T in ENVS are not required to fulfill SF State Studies requirements.'
    - 'Environmental Science Major: 49-54 units. BIOL and PHYS Requirements; CHEM 115 or CHEM 180, GEOG 101, GEOG 160, MATH
      197/MATH 198 or MATH 199, MATH 226 (26 units) met before transfer. Foundation Requirements (6 units) if not taken before
      transfer: ENVS 130 or GEOG 102; ENV 205. Core Requirements (12-13 units). Capstone (3 units): ENV 690. Topical Areas
      (28-32 units).'
    - 'University Electives: 6 or more units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State - some courses may meet more than one requirement,
      e.g., in both UD GE and the major.'
    - '1 Environmental Systems (11-12 units): A full list of courses that can fulfill this requirement can be found in the
      Degree Requirements (p. 1640). (p. 2047)'
    - '2 Environmental Management (10-12 units): A full list of courses that can fulfill this requirement can be found in
      the Degree Requirements (p. 1640). (p. 2047)'
    - '3 Analytical Methods (7-8 units): A full list of courses that can fulfill this requirement can be found in the Degree
      Requirements (p. 1640). (p. 2047)'
