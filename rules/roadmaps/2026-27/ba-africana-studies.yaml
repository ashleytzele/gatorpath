  adt:
    title: Bachelor of Arts in Africana Studies – Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.408-409
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an approved ADT. All lower-division GE requirements have been satisfied. Check with a major advisor about the most appropriate
      course sequence. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section for more
      information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, CA State and
      Local Government requirements. If not completed before transfer, some major course options may also satisfy the requirement.
      Upper-Division GE (9 units): Courses required for the major may double-count if approved for UD GE. Students entering
      the major with an approved ADT are not required to fulfill SF State Studies requirements. Complementary Studies: Consult
      with a department advisor on how transfer units and/or SF State units can be applied to ensure degree completion within
      60 units.'
    - 'Africana Studies Major: 39 Units. Core Requirements (27 units). Areas of Emphasis (9 units) – in consultation with
      a department advisor, choose three courses from Africana Humanities, Africana Behavioral and Social Sciences, Africana
      Educational Studies and Technology, Elijah Muhammad Studies, or Gender and Sexuality Studies. Graduation Writing Assessment
      Requirement/GWAR (3 units): ETHS 300GW.'
    - 'University Electives: 9 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., in both UD GE and the major.'
    - '1: Area of Emphasis (9 units). A full list of courses that can fulfill this requirement can be found in the Degree
      Requirements (p. 402).'
    - 'Associate Degrees for Transfer (ADTs) that are approved for the BA in Africana Studies are: AA-T in Child and Adolescent
      Development; AA-T in History; AA-T in Law, Public Policy, and Society; AA-T in Music; AA-T in Political Science; AA-T
      in Social Justice Studies; AA-T in Social Work and Human Services.'
