    total_units: 120
    source: p.643-644
    notes:
    - 120 Total Units Required
    - 'Minimum Number of Units in the Major: 36'
    - This roadmap is a suggested plan of study and does not replace meeting with an advisor. Please note that students may
      need to adjust the actual sequence of courses based on course availability. Please consult your Degree Planner (https://registrar.sfsu.edu/degreeplanner)
      and an advisor for further guidance.
    - To avoid taking additional units, it is recommended that you meet the SF State Studies (AERM, GP, ESCA, SJ) requirements
      within your GE or major.
    - 1 Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 1A course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/)
    - '2 Complementary Studies: Bachelor of Arts students must complete at least 12 units of Complementary Studies outside
      of the primary prefix for the major. (Note: Students may not use an alternate prefix that is cross-listed with the primary
      prefix for the major.) Students who complete two majors or a major and a minor automatically complete the Complementary
      Studies requirement. An additional way to complete Complementary Studies for students in the Criminal Justice major
      is to meet with an advisor to identify 12 units of courses complementary to the major. With advisor approval, up to
      12 of these units may be used to satisfy units in the major. Consult with your major advisor for assistance. Students
      who have earned AA-T or AS-T degrees and are pursuing a similar B.A. degree at SF State are required to fulfill the
      Complementary Studies requirement as defined by the major department. Students should consult with a major advisor about
      how transfer units and/or SF State units can best be applied to this requirement to ensure degree completion within
      60 units.'
    - 3 Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 2 course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/)
    - 4 Consider taking a class with a combined laboratory or a separate lab to fulfill GE Area 5C if not already satisfied.
    - '5 Power and Inequality Elective (3 units): A full list of courses that can be used to fulfill this requirement can
      be found in the Degree Requirements (p. 639). (p. 639)'
    - '6 Criminal Justice Law and Administration Elective (3 units): A full list of courses that can be used to fulfill this
