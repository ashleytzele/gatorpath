  adt:
    title: Bachelor of Arts in Criminal Justice Studies – AJ Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.645-646
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AS-T in Administration of Justice. Six units in the major (Electives) and all lower-division GE requirements have
      been satisfied. Check with a major advisor about the most appropriate course sequence. Degree completion guaranteed
      in 60 units; see the Associate Degree for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not taken before transfer. Upper-Division GE (9 units): Courses required
      for the major may double-count if approved for UD GE. Students entering the major with the AS-T in Administration of
      Justice are not required to fulfill SF State Studies requirements. Complementary Studies: Consult with a department
      advisor on how transfer units and/or SF State units can be applied to ensure degree completion within 60 units.'
    - 'Criminal Justice Major: 30-34 Units. Six units from the AS-T can apply to Electives – see a department advisor. Core
      Courses (18 units). Electives (12-16 units).'
    - 'University Electives: 18 or More Units. Depending on course choices made at the community college, how transferred
      units are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., in both UD GE and in the major. Upper-division electives are recommended to meet the minimum 30-unit requirement.'
    - '1 Criminal Justice Studies Electives (12-16 units): A full list of courses that can be used to fulfill this requirement
      can be found in the Degree Requirements (p. 639). (p. 639)'
