  adt:
    title: Bachelor of Arts in Studio Art – ARTH Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.932-933
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AA-T in Art History. 12 to 15 units in the major (two to three lower-division studio courses, two lower-division
      art history courses) and all lower-division GE requirements have been satisfied. Check with a major advisor about the
      most appropriate course sequence. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT)
      section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not taken before transfer. Upper-Division GE Areas 2UD/5UD, 3UD, and 4UD
      (9 units): Courses required for the major may double-count if approved for UD GE. Students entering the major with the
      AA-T in Studio Arts are not required to fulfill SF State Studies requirements.'
    - 'Art (Studio Art) Major: 28-31 Units. 12 to 15 units met in transfer: Two to three lower-division studio courses, two
      lower-division art history courses. Students who completed only 6 units of studio courses may substitute 3 units of
      upper-division studio. Upper-Division Art History (6 units); 300-Level Foundation Studio Art (3 units); Upper-Division
      Studio Art (12-15 units): 15 units required if only 6 units of studio completed before transfer. Choose four upper-division
      studio art (ART) courses. An upper-division Art History (ARTH) course may be substituted for one upper-division ART
      course under advisement; Art Productions (1 unit): ART 509; Graduation Writing Assessment Requirement (3 units): ARTH
      400GW; Capstone Course (3 units): ART 600 or ART 619.'
    - 'University Electives: 14 or More Units. Units depending on course choices made at the community college, how transferred
      units are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., both in UD GE and the major.'
    - 'Upper-Division Art History (6 Units Total): A full list of courses that can fulfill this requirement can be found in
      the Degree Requirements (p. 926). (footnote 1)'
    - '300-Level Foundation Studio Art (3 units): A full list of courses that can fulfill this requirement can be found in
      the Degree Requirements (p. 926). (footnote 2)'
    - 'Upper-Division Studio Art (12 Units Total): A full list of courses that can fulfill this requirement can be found in
      the Degree Requirements (p. 926). (footnote 3)'
