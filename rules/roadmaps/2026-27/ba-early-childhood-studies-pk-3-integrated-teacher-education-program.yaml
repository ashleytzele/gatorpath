      an AA-T in Early Childhood Education. Twelve units in the major (CAD 210, CAD 215, CAD 260, and CAD 280) and all lower-division
      GE requirements have been satisfied. Check with a major advisor about the most appropriate course sequence. Degree completion
      guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 0-6 units. American Institutions (0-6 units): US History, US Government, California State
      and Local Government requirements if not taken before transfer. Upper-Division GE Areas 2UD/5UD, 3UD, and 4UD (0 units):
      All UD GE Areas are fulfilled through the major requirements. Students entering this major with an approved ADT are
      not required to fulfill SF State Studies requirements.'
    - 'Early Childhood Studies Major (Child Development Pre-K to 3rd Grade Integrated Teacher Education Program): 60 units.
      CAD 210, CAD 215, CAD 260, and CAD 280 met in transfer. Core (21 units): Includes GWAR and Capstone. Science (3 units):
      Also fulfills GE Area 5UD. Art (3 units): Also fulfills GE Area 3UD. Credential (33 units). A minimum grade of C or
      better is required for all courses in the major.'
    - 'University Electives: 0 or More units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
