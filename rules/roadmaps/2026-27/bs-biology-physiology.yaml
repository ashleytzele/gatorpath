  adt:
    title: 'Bachelor of Science in Biology: Concentration in Physiology – BIOL Associate Degree for Transfer (ADT) Roadmap'
    total_units: 60
    source: p.1843-1844
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AS-T in Biology. Twenty-six units in the major (BIOL 230/BIOL 240, CHEM 115, CHEM 215, MATH 226, required PHYS sequence)
      and 33 units of lower-division GE requirements have been satisfied. Check with a major advisor about the most appropriate
      course sequence. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section for more
      information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 12-18 Units. American Institutions (0-6 units): US History, US Government, CA Government.
      Lower-Division GE (6 units) – Area C (3 units in any subarea) and Area D (3 units). Upper-Division GE (6 units): Area
      5UD Met in Major. Courses may satisfy both American Institutions and Upper-Division GE if approved for multiple areas.
      Students entering this major with the AS-T in Biology are not required to fulfill SF State Studies requirement.'
    - 'Biology – Physiology Major: 32 Units. BIOL 230/BIOL 240, MATH 226, all PHYS, CHEM 115, CHEM 215 met in transfer. Lower-Division
      Requirements (4 units): CHEM 130 or CHEM 233, BIOL 231. Upper-Division Requirements (22-23 units). Physiology Electives
      (5-6 units).'
    - 'University Electives: 10 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State - some courses may meet more than one requirement,
      e.g., both in UD GE and the major.'
    - 'Footnote 1: Area 5UD (Upper-Division Science) is satisfied upon completion of BIOL 355.'
    - 'Footnote 2: Major Upper-Division Core Physiology Option (3 units). A full list of courses that can fulfill this requirement
      can be found in the Degree Requirements (p. 1835).'
    - 'Footnote 3: Electives (5-6 units). A full list of courses that can fulfill this requirement can be found in the Degree
      Requirements (p. 1835).'
