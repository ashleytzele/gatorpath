      major may double-count if approved for UD GE. Students entering the major with the AS-T in BIOL are not required to
      fulfill SF State Studies requirements.'
    - 'Environmental Studies Major: 49-59 units. BIOL 230, BIOL 240, CHEM 115 or CHEM 180, and ERTH 230 or GEOG 101 met before
