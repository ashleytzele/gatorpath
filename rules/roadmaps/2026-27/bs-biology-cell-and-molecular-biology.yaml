  adt:
    title: 'Bachelor of Science in Biology: Concentration in Cell and Molecular Biology – BIOL Associate Degree for Transfer
      (ADT) Roadmap'
    total_units: 60
    source: p.1803-1804
    met_in_transfer:
    - BIOL 230
    - BIOL 240
    - MATH 226
    - CHEM 115
    - CHEM 215
    - {one_of: [[PHYS 111, PHYS 112], [PHYS 220, PHYS 222]]}
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AS-T in Biology. Twenty-six units in the major (BIOL 230/BIOL 240, CHEM 115, CHEM 215, MATH 226, required PHYS sequence)
      and 33 units of lower-division GE requirements have been satisfied. Check with a major advisor about the most appropriate
      course sequence. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section for more
      information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 12-18 Units. American Institutions (0-6 units): US History, US Government, CA Government.
      If not met in transfer, see next bullets. Lower-Division GE (6 units) – Area 3 (3 units in any subarea) and Area 4 (3
      units). Upper-Division GE (6 units): Area 5UD met in major. Also, courses may satisfy the US History or US/CA Government
      requirements, and GE 3UD or GE 4UD at the same time, if approved for multiple areas.'
    - Students entering this major with the AS-T in Biology are not required to fulfill SF State Studies requirements.
    - 'Biology – Cell and Molecular Biology Major: 32 Units. Completed: BIOL 230/BIOL 240, MATH 226, all PHYS, and CHEM 115/CHEM
      215. Lower-Division Requirements (4 units): CHEM 130 or CHEM 233; BIOL 231. Major Upper-Division Requirements/GWAR (22-23
      units). Major Upper-Division Electives (5-6 units) – upon advisement; includes lab component.'
    - 'University Electives: 11 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., UD GE and the major.'
    - 'Footnote 1: Area 5UD (Upper-Division Science) is satisfied upon completion of BIOL 355.'
    - 'Footnote 2: Major Electives (5-6 units). A full list of courses that can fulfill this requirement can be found in the
      Degree Requirements (p. 1795).'
