  adt:
    title: Bachelor of Arts in Latina/Latino Studies – Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.481-482
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an approved ADT. All lower-division GE requirements have been satisfied. Check with a major advisor about the most appropriate
      course sequence for you. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section
      for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 15 Units. American Institutions (0-6): US History, US Government, CA State and Local
      Government requirements. If not completed before transfer, some major requirement courses also satisfy specific major
      requirements. Upper-Division GE (9 units): Courses required for the major may double-count if approved for UD GE. Students
      entering the major with an approved ADT are not required to fulfill SF State Studies requirements.'
    - 'Latina/Latino Studies Major: 33 Units. Core (15 units). GWAR: ETHS 300GW. Electives (15 units).'
    - 'University Electives: 15 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g. in both UD GE and in the major.'
    - 1 Major Electives (15 units). A full list of courses that can fulfill this requirement can be found in the Degree Requirements
      (p. 475).
    - 2 Students must complete at least 35 hours of service as part of a local community service learning internship.
    - 'Associate Degrees for Transfer (ADTs) that are approved for the BA in Latina/Latino Studies are: AA-T in Anthropology;
      AA-T in Art History; AA-T in English; AA-T in Global Studies; AA-T in Political Science; AA-T in Sociology; AA-T in
      Social Justice Studies; AA-T in Social Work and Human Services.'
