  adt:
    title: Bachelor of Arts in Liberal Studies - HIST Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.1409-1410
    notes:
    - Suspended - Not Accepting New Majors
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AA-T in History. All lower-division GE requirements have been satisfied. Check with a major advisor about the most
      appropriate course sequence. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section
      for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-12 Units. American Institutions (0-3 units): US Government, California State and Local
      Government requirements if not taken before transfer. US History completed in ADT. Upper-Division GE Areas 2UD/5UD,
      3UD, 4UD (9 units): Courses required for the major may double-count if approved for UD GE. Students entering this major
      with an approved ADT are not required to fulfill SF State Studies requirements; also, because of the interdisciplinary
      nature of the major, students automatically fulfill the Complementary Studies requirement.'
    - 'Liberal Studies Major: 42-43 Units. Core (6) - includes University GWAR course. Area Core Courses (24-25). Electives
      (12).'
    - 'University Electives: 6 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State - some courses may meet more than one requirement,
