  first-time:
    title: Bachelor of Arts in Liberal Studies Roadmap
    total_units: 120
    source: p.1406-1407
    notes:
    - Suspended - Not Accepting New Majors
    - '120 Total Units Required. Minimum Number of Units in the Major: 42'
    - This roadmap is a suggested plan of study and does not replace meeting with an advisor. Please note that students may
      need to adjust the actual sequence of courses based on course availability. Please consult your Degree Planner (https://registrar.sfsu.edu/degreeplanner)
      and an advisor for further guidance.
    - To avoid taking additional units, it is recommended that you meet the SF State Studies (AERM, GP, ESCA, SJ) requirements
      within your GE or major.
    - Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 1A course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/) (footnote 1)
    - First-time freshmen must take one lower-division Area 4 course that meets US History (USH). (footnote 2)
    - 'Complementary Studies: Required of all candidates for the Bachelor of Arts degree in Liberal Studies are 12 units of
      Complementary Studies, which must come from courses bearing a prefix other than LS, and not cross-listed with LS. Complementary
      Studies for the Liberal Studies major can be satisfied via four possible routes: 12 units of a language; 12 units towards
      completion of a minor or 2nd major or certificate. Suggested minors include: Education, Special Education, any minor
      in Ethnic Studies, American Studies, California Studies, Comics Studies, Counseling, Holistic Health, Health Education,
      Earth Sciences, Communication Studies, any minor in Modern Languages (Chinese, French, German, Italian, Japanese, Persian,
      Russian), Humanities, Math, History, Global Peace Studies, Criminal Justice Studies, Women and Gender Studies; any 12
      units outside of LS prefix and not cross-listed with LS; Study Abroad. Students who have earned AA-T or AS-T degrees
      and are pursuing a similar B.A. degree at SF State are required to fulfill the Complementary Studies requirement as
      defined by the major department. Students should consult with a major advisor about how transfer units and/or SF State
      units can best be applied to this requirement to ensure degree completion within 60 units. (footnote 3)'
    - Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 2 course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/) (footnote 4)
    - Consider taking a class combined with a laboratory or a separate lab to fulfill 5C if not already satisfied. (footnote
      5)
    - 'Literature and Culture (3 units): A full list of courses that can fulfill this requirement can be found in the Degree
      Requirements (p. 1402). (footnote 6)'
    - 'Communication Studies (3-4 units): A full list of courses that can fulfill this requirement can be found in the Degree
      Requirements (p. 1402). (footnote 7)'
    - 'Electives (12 units): Choose one of the following options, in consultation with an advisor: A. Complete at least 12
      units that are part of a minor, certificate, or another major on campus. Suggested minors include Education, Special
      Education, any minor in Ethnic Studies, American Studies, California Studies, Comics Studies, Counseling, Holistic Health,
      Health Education, Earth Sciences, Communication Studies, Modern Languages (Chinese, French, German, Italian, Japanese,
      Persian, Russian), Humanities, Math, History, Global Peace Studies, Criminal Justice Studies, and Women and Gender Studies.
      For double majoring, please consult a Liberal Studies adviser. B. Complete 12 units of additional courses (not already
      counted for the core) outlined in the Teacher Preparation Emphasis. See program website or adviser for a list of courses
      to choose from. C. In consultation with a Liberal Studies faculty advisor, design and complete a 12-unit elective pattern.
      (footnote 8)'
    - 'Life Sciences (3 units): A full list of courses that can fulfill this requirement can be found in the Degree Requirements
      (p. 1402). (footnote 9)'
    - 'Integrated Social Sciences (6 units): A full list of courses that can fulfill this requirement can be found in the
      Degree Requirements (p. 1402). (footnote 10)'
    - 'Physical Sciences (3 units): A full list of courses that can fulfill this requirement can be found in the Degree Requirements
      (p. 1402). (footnote 11)'
