    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AS-T in Mathematics. At least 12 units in the major (MATH 226, MATH 227, MATH 228) and all lower-division GE requirements
      have been satisfied. Additional units in the major may have been satisfied. Check with a major advisor about the most
      appropriate course sequence. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section
      for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not taken before transfer. Upper-Division GE (9 units): Courses required
      for the major may double-count if approved for UD GE. Students entering this major with the AS-T in Mathematics are
      not required to fulfill SF State Studies requirements. Complementary Studies: Consult with a department advisor on how
      transfer units and/or SF State units can be applied to ensure degree completion within 60 units.'
    - 'Mathematics for Advanced Study Major: 37-41 Units. MATH 226, MATH 227, and MATH 228 met in transfer. Core (16-20 units).
      Concentration (21 units).'
    - 'University Electives: 4 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., UD GE and the major.'
    - '1: CSC 101 and CSC 215 must both be taken to fulfill this requirement. CSC 101 and CSC 215 are only recommended if
