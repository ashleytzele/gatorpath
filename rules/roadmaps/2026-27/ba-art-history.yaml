  adt:
    title: Bachelor of Arts in Art History – ARTH Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.916-917
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AA-T in Art History. Nine units in the major (one lower-division studio course, two lower-division art history courses)
      and all lower-division GE requirements have been satisfied. Check with a major advisor about the most appropriate course
      sequence. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section for more information
      (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not taken before transfer. Upper-Division GE, Areas 2UD/5UD, 3UD, 4UD (9
      units): Courses required for the major may double-count if approved for UD GE. Students entering the major with the
      AA-T in Art History are not required to fulfill SF State Studies requirements.'
    - 'Art (Art History) Major: 30 Units. Lower-division requirements satisfied in transfer – 6 units of art history and 3
      units of studio arts. Graduation Writing Assessment Requirement (3 units): ARTH 400GW. Upper-Division Art History (9
      units): 300-400 level art history lectures. Advanced Topics in Art History (3 units). Elective (6 units): Two additional
      300–600 level art history courses selected by the student. Internship (3 units). Capstone (3 units).'
    - 'University Electives: 18 or More Units. Units depend on course choices made at the community college, how transferred
      units are applied to the requirements above, and course choices at SF State – some courses may meet more than one requirement,
      e.g., both in UD GE and the major.'
    - '1: Upper-Division Art History Lectures (9 units). A full list of courses that can be used to fulfill this requirement
