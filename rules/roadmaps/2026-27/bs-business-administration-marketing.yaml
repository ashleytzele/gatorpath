      Courses required for the major may double-count if approved for UD GE. Students entering the major with the AS-T in
      Business Administration with a concentration in Marketing are not required to fulfill SF State Studies requirements.'
    - 'BS in Business Administration: Concentration in Marketing major: 48-54 units. ACCT 100/ACCT 101, DS 212, ECON 101/ECON
