      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/)
    - 3 First-time freshmen must take one lower-division Area 4 course that meets US History (USH).
    - 4 Consider taking a class combined with a laboratory or a separate lab to fulfill 5C if not already satisfied.
    - 5 Electives (19 units). Upper-division SOC courses or courses cross-listed with SOC not used to meet other major requirements.
      Students may use up to 9 units of lower-division sociology courses or courses cross-listed with SOC not used to meet
      other major requirements.
    - 6 Sociology Capstone (3-4 units). A full list of courses that can fulfill this requirement can be found in the Degree
      Requirements (p. 851).
