  adt:
    title: Bachelor of Arts in Sociology – SOC Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.856-857
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AA-T in Sociology. Twelve units in the major [electives] and all lower-division GE requirements have been satisfied.
      Check with a major advisor about the most appropriate course sequence. Degree completion guaranteed in 60 units; see
      the Associate Degree for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not met before transfer. Upper-Division GE, Areas 2UD/5UD, 3UD, and 4UD (9
      units): Upper-division GE (9 units): Courses required for the major may double-count if approved for UD GE. Students
      entering this major with the AA-T in Sociology are not required to fulfill SF State Studies requirements.'
    - 'Sociology Major: 30-31 Units. Core Courses (20 units). Capstone (3-4 units). Elective Courses: (7 units). 12 units
      from ADT may be applied to electives.'
    - 'University Electives: 13 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., in both UD GE and the major. Upper-division electives are recommended to meet the minimum 30-unit requirement.'
    - 1 Major Electives. 19 units total, 12 units met in transfer. Upper-division SOC courses or courses cross-listed with
      SOC not used to meet requirements above. Up to 9 units of lower-division sociology courses or courses cross-listed with
      SOC not used to meet requirements above.
    - 2 Sociology Capstone (3-4 units). A full list of courses that can fulfill this requirement can be found in the Degree
      Requirements (p. 851).
