      to include the following:'
    - 'University-Wide Requirements: 9-15 units. American Institutions (0-6 units): US History, US Government, CA Government.
      If not met in transfer, see the next bullets. Upper-Division GE Areas 2UD/5UD, 3UD, and 4UD (9 units): Courses required
      for the major may double-count if approved for UD GE. Students entering the major with the AA-T in SWHS are not required
      to fulfill SF State Studies requirements. Complementary Studies: Consult with a department advisor on how transfer units
      and/or SF State units can be applied to ensure degree completion within 60 units.'
    - 'Social Work Major: 42 units. Required Courses (42 units).'
    - 'University Electives: 3 or more units. Units depending on course choices made at the community college, how transferred
      units are applied to the requirements above, and course choices at SF State - some courses may meet more than one requirement,
      e.g., in both UD GE and the major.'
