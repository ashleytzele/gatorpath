    notes:
    - 120 Total Units Required
    - 'Minimum Number of Units in the Major: 42'
    - This roadmap is a suggested plan of study and does not replace meeting with an advisor. Please note that students may
      need to adjust the actual sequence of courses based on course availability. Please consult your Degree Planner (https://registrar.sfsu.edu/degreeplanner)
      and an advisor for further guidance.
    - To avoid taking additional units, it is recommended that you meet the SF State Studies (AERM, GP, ESCA, SJ) requirements
      within your GE or major.
    - '1: Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 1A course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/)'
    - '2: Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 2 course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/)'
    - '3: First-time freshmen must take one lower-division Area 4 course that meets US History (USH).'
    - '4: Complementary Studies. Students completing a Bachelor of Arts in Social Work (B.A.S.W.) degree must complete 12
      units in Complementary Studies in courses bearing a prefix other than S W and not cross-listed with S W. BASW majors
      will be offered several pathways toward completing this requirement, each of which is designed to facilitate graduation
      in a timely manner. These 12 units may be satisfied in the following ways: 1. 3 units of biology or sexuality studies,
      3 units of psychology, 3 units of economics, and 3 units of sociology. 2. 12 units of courses taken towards a certificate,
      a minor, or a second major in a related discipline. Students who have earned AA-T or AS-T degrees and are pursuing a
      BASW degree at SF State are required to fulfill the Complementary Studies requirement as defined by the School of Social
      Work. Students should consult with their social work advisor about how transfer units and/or SF State units can best
      be applied to this requirement to ensure degree completion within 60 units. With the approval of an advisor in the major,
      courses which fulfill the Complementary Studies requirement may be lower or upper-division units, resident or transfer
      units.'
    - '5: Consider taking a class combined with a laboratory or a separate lab to fulfill 5C if not already satisfied.'
