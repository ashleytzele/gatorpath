    title: Bachelor of Arts in International Relations Roadmap
    total_units: 120
    source: p.1325-1326
    notes:
    - This roadmap is a suggested plan of study and does not replace meeting with an advisor. Please note that students may
      need to adjust the actual sequence of courses based on course availability. Please consult your Degree Planner (https://registrar.sfsu.edu/degreeplanner)
      and an advisor for further guidance.
    - To avoid taking additional units, it is recommended that you meet the SF State Studies (AERM, GP, ESCA, SJ) requirements
      within your GE or major.
    - 'Footnote 1: Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the
      appropriate GE 1A course option. For directions on how to view your Pathway/Category, visit how to find your pathway
      (https://gatorsmartstart.sfsu.edu/howtofindyourpathways). Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/)'
    - 'Footnote 2: Recommended GE Courses: GE Area 1A I R 205 (GE 1A); GE Area 1C I R 207 (GE 1C); GE Area 2 I R 112/HIST
      112/LCA 112/MATH 112/PHIL 112/PLSI 112 Quantitative Reasoning for Civic Engagement (3 units) (GE 2, SJ); GE Area 3B
      I R 260/PRSN 260 History and Cultures of Iran (3 units) (GE 3B, GP)'
    - 'Footnote 3: Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the
      appropriate GE 2 course option. For directions on how to view your Pathway/Category, visit how to find your pathway
      (https://gatorsmartstart.sfsu.edu/howtofindyourpathways). Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/)'
    - 'Footnote 4: Complementary Studies. 12 units of Complementary Studies are required of all candidates for the Bachelor
      of Arts degree in International Relations. These units must come from courses bearing a prefix other than I R, and not
      cross-listed with I R. International Relations majors are offered several pathways toward completing this requirement,
      each of which is designed to facilitate graduation in a timely manner. International Relations majors may, with the
      approval of an International Relations advisor, elect to apply 12 units in a single foreign language of their choosing,
      courses taken in an approved study abroad program (e.g., CSU Study Abroad), courses taken as part of a second major,
      a minor or a certificate, and courses in a related discipline. Related disciplines typically include: political science,
      sociology, anthropology, environmental studies, geography, global health, or journalism. Up to six units of a single
      language or six upper-division units of Complementary Studies may, with the approval of a departmental advisor, also
      be counted as International Relations electives in fulfillment of major requirements.'
    - 'Footnote 5: Consider taking a class combined with a laboratory or a separate lab to fulfill 5C if not already satisfied.'
    - 'Footnote 6: Major Electives (18 Units). Students are required to complete 18 elective units related to international
      relations. At least 12 units of coursework must be upper-division I R courses (300-level or above) or be cross-listed
      with I R. Six additional units may be taken outside of the department upon the approval of a major advisor. Lower-division
      language courses taken in the Department of Modern Languages and Literatures and 200-level I R courses can be used for
      these 6 units; otherwise, upper-division courses are required.'
