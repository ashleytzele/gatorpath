  adt:
    title: Bachelor of Arts in International Relations – Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.1327-1328
    met_in_transfer:
    - I R 104
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an approved ADT. Three units in the major (I R 104) and all lower-division GE requirements have been satisfied. Check
      with a major advisor about the most appropriate course sequence. Degree completion guaranteed in 60 units; see the Associate
      Degree for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not met pre-transfer. Upper-Division GE Areas 2UD/5UD, 3UD, and 4UD (9 units):
      Courses required for the major may double-count if approved for UD GE. Students entering the major with an approved
      ADT are not required to fulfill SF State Studies requirements. Complementary Studies: Consult with a department advisor
      on how transfer units and/or SF State units can be applied to ensure degree completion within 60 units.'
    - 'International Relations Major: 40 Units. I R 104 met in transfer. Core Requirements (16 units). Emphasis/Electives
      (18 units): In consultation with a department advisor, students select one of the following emphases: Area Studies;
      International Institutions; Global Problems. 12 of the required 18 units must be courses with the I R prefix. Culminating
      Experience Requirement (6 units): I R 550.'
    - 'University Electives: 8 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., in both UD GE and the major.'
    - 'Footnote 1: Major Electives (18 Units). Students are required to complete 18 elective units related to international
      relations. At least 12 units of coursework must be upper-division I R courses (300-level or above) or be cross-listed
      with I R. Six additional units may be taken outside of the department upon the approval of a major advisor. Lower-division
      language courses taken in the Department of Modern Languages and Literatures and 200-level IR courses can be used for
      these 6 units; otherwise, upper-division courses are required.'
    - 'Associate Degrees for Transfer (ADTs) that are approved for the BA in International Relations are: AA-T in Administrative
      Justice; AA-T in Anthropology; AS-T in Business; AA-T in Chicano/a Studies or Latino/a Studies; AA-T in Child and Adolescent
      Development; AA-T in Communication; AA-T in English; AA-T in Film, TV; AA-T in Geography; AA-T in Global Studies; AA-T
      in History; AA-T in Hospitality; AA-T in Journalism; AA-T in Law, Public Policy, Society; AA-T in Philosophy; AA-T in
      Political Science; AA-T in Psychology; AA-T in Public Health; AA-T in Social Justice; AA-T in Social Work; AA-T in Sociology;
      AA-T in Spanish'
