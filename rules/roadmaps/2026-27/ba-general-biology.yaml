      - slot: major
        group: ud_electives
        units: 7
        note: Upper-Division Electives - Take as Needed; 7-16 units; footnote 5
      - slot: GE
        area: GW
        units: 3
        note: Biology GWAR course, or University Elective if requirement already met
      - slot: elective
        units: 6
        note: University Electives - Take as needed to reach 16 units this semester
