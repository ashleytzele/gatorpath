  adt:
    title: Bachelor of Arts in General Biology – BIOL Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.1793-1794
    met_in_transfer:
    - BIOL 230
    - BIOL 240
    - CHEM 115
    - CHEM 215
    - MATH 226
    - PHYS 111
    - PHYS 112
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AS-T in Biology. 18 units in the major (BIOL 230/BIOL 240, CHEM 115, CHEM 215, MATH 226, PHYS 111, and PHYS 112)
      and 33 units of lower-division GE requirements have been satisfied. Check with a major advisor about the most appropriate
      course sequence. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section for more
      information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 15-21 Units. American Institutions (0-6 units): Courses may satisfy both American Institutions
      and Upper-Division GE if approved for multiple areas. Lower-Division GE (6 units): Area 3 (3 units in any subarea) and
      Area 4 (3 units). Upper-Division GE (9 units): Courses required for the major may double-count if approved for UD GE.
      B.A. Biology students satisfy Complementary Studies by taking courses in chemistry, physics, and mathematics that are
      required for the major.'
    - 'General Biology Major: 40 Units. BIOL 230/BIOL 240, MATH 226, PHYS 111, PHYS 112, CHEM 115, CHEM 215 met in transfer.
      Lower-Division Requirements (4 units): BIOL 231, either CHEM 130 or CHEM 233 (Hidden prerequisite for CHEM 233 met in
      transfer). Major Upper-Division Requirements/GWAR (16-23 units). Major Upper-Division Electives (7-16 units).'
    - 'University Electives: 7 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., both in UD GE and the major. Upper-division electives recommended to meet the minimum 40-unit requirement.'
    - 'Footnote 1: Area 5UD (Upper-Division Science) is satisfied upon completion of BIOL 355.'
    - 'Footnote 2: Physiology or Cell Biology Course (3-4 units). A full list of courses that can fulfill this requirement
      can be found in the Degree Requirements (p. 1784).'
    - 'Footnote 3: Physiology or Cell Biology Laboratory Course (1-4 units). A full list of courses that can fulfill this
      requirement can be found in the Degree Requirements (p. 1784).'
    - 'Footnote 4: Ecology, Evolution, or Organismal Biology Courses (6-9 units). A full list of courses that can fulfill
      this requirement can be found in the Degree Requirements (p. 1784).'
    - 'Footnote 5: Upper-Division Electives (7-16 units). A full list of courses that can fulfill this requirement can be
      found in the Degree Requirements (p. 1784).'
    semesters:
    - units: 16
      source: p.1793
      items:
      - BIOL 231
      - slot: major
        group: lower_organic_chemistry
        units: 3
        note: 'Select One (Major Lower-Division Core): CHEM 130 or CHEM 233'
      - slot: GE
        area: '3'
        units: 3
      - slot: GE
        area: '4'
        units: 3
      - slot: ai
        area: USH
        units: 3
        note: US History (p. 2350), or University Elective if met in transfer
      - slot: elective
        units: 3
    - units: 13
      source: p.1793
      items:
      - BIOL 355
      - slot: major
        group: ud_physiology_cell
        units: 3
        note: Physiology or Cell Biology; 3-4 units; footnote 2
      - slot: major
        group: ud_physiology_cell_lab
        units: 1
        note: Physiology or Cell Biology Laboratory; 1-4 units; footnote 3
      - slot: GE
        area: 3UD
        units: 3
      - slot: ai
        area: USG/CSLG
        units: 3
        note: US and California Government (p. 2351), or University Elective if met in transfer
    - units: 15
      source: p.1793-1794
      items:
      - BIOL 337
      - slot: major
        group: ud_ecology_evolution_organismal
        count: 2
        units: 6
        note: Take Two; 6-9 units; footnote 4
      - slot: GE
        area: 4UD
        units: 3
      - slot: elective
        units: 3
        note: University Elective (if needed to reach 15 units this semester); 0-3 units
    - units: 16
      source: p.1794
