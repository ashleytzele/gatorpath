    - 'Footnote 5: GE Area 5B (Biological Science) is satisfied upon completion of BIOL 240.'
    - 'Footnote 6: Area 5UD (Upper-Division Science) is satisfied upon completion of BIOL 355.'
    - 'Footnote 7: Physiology or Cell Biology Course (3-4 units). A full list of courses that can fulfill this requirement
