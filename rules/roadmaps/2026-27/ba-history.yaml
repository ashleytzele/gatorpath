  adt:
    title: Bachelor of Arts in History – HIST Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.1236-1237
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AA-T in History. Twelve units in the major (from HIST 110, HIST 114, HIST 115, HIST 120, and HIST 121) and all lower-division
      GE requirements have been satisfied. Check with a major advisor about the most appropriate course sequence. Degree completion
      guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-12 Units. American Institutions (0-3 units): US Government, California State and Local
      Government requirements if not taken before transfer. US History completed in ADT.'
    - 'Upper-Division GE Areas 2UD/5UD, 3UD, and 4UD (9 units): Courses required for the major may double-count if approved
      for UD GE.'
    - Students entering this major with the AA-T in History are not required to fulfill SF State Studies requirements.
    - 'History Major: 27 Units. Lower-Division Requirements (12 units): Completed in ADT. Core (6 units): HIST 300GW, HIST
      696. Upper-Division Electives (21 units): Within upper-division studies, meet four Breadth requirements. See Note 2.'
    - 'University Electives: 21 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., both in UD GE and the major.'
    - 'Electives (21 units): Students must take seven additional upper-division History courses outside of the core. The upper-division
      breadth requirements are completed within these elective units. Three upper-division units (normally one course) outside
      the major (with a non-HIST prefix) may be counted upon advisement. Students may take additional courses as electives
