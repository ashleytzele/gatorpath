  adt:
    title: 'Bachelor of Science in Kinesiology: Concentration in Exercise and Movement Sciences – KIN Associate Degree for
      Transfer (ADT) Roadmap'
    total_units: 60
    source: p.715-716
    met_in_transfer:
    - KIN 250
    - BIOL 100
    - BIOL 101
    - BIOL 220
    - BIOL 212
    - BIOL 213
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AA-T in Kinesiology. At least 16 lower-division units in the major (KIN 250, BIOL 100, BIOL 101, BIOL 220, BIOL 212,
      BIOL 213, and one activity unit) and all lower-division GE requirements have been satisfied. Additional units in the
      major may have been satisfied. Check with a major advisor about the most appropriate course sequence. Degree completion
      guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, CA Government.
      If not met in transfer, see the next bullet.'
    - 'Upper-division GE (9 units): Courses may satisfy the US History or US/CA Government requirements, and 3UD or 4UD at
      the same time, if approved for multiple areas.'
    - Students entering the major with the AA-T in Kinesiology are not required to fulfill the SF State Studies requirement.
    - 'Kinesiology: Concentration in Exercise and Movement Sciences Major: 55 units. KIN 250, BIOL 220 or BIOL 328, BIOL 212,
      BIOL 213, and one unit of activity met in transfer.'
    - 'Prerequisites (13 units): BIOL 100 and BIOL 101 or BIOL 230; CHEM 101 and CHEM 102 or CHEM 115; and a Quantitative
      Reasoning course (see footnote 1) if not completed before transfer with a grade of C or better.'
    - 'Core: (16 units): KIN 384GW, KIN 457, KIN 480, KIN 482, and KIN 486.'
    - Concentration (14 units:) PHYS 101/PHYS 102 or PHYS 111/PHYS 112 if not completed before transfer; KIN 404, KIN 483,
      KIN 485, KIN 696 or KIN 697-KIN 698 or KIN 699.
    - Electives (12 units)
    - 'University Electives: 2 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., both in UD GE and the major.'
    - 'Footnote 1: Quantitative Reasoning Requirement (3-4 units). A full list of courses that can fulfill this requirement
      can be found in the Degree Requirements (p. 710).'
    - 'Footnote 2: US History, US/CA Government, and GE 3UD. Select One: HIST 470 The U.S. Constitution to 1896 (3 units)
      (GE 3UD, USH, USG/CSLG, AERM, SJ); HIST 471 The U.S. Constitution Since 1896 (3 units) (GE 3UD, USH, USG/CSLG, AERM,
      SJ).'
    - 'Footnote 3: Major Electives (12 units). A full list of courses that can fulfill this requirement can be found in the
      Degree Requirements (p. 710).'
