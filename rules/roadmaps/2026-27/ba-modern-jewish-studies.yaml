    total_units: 120
    source: p.1360-1361
    notes:
    - '120 Total Units Required. Minimum Number of Units in the Major: 30.'
    - This roadmap is a suggested plan of study and does not replace meeting with an advisor. Please note that students may
      need to adjust the actual sequence of courses based on course availability. Please consult your Degree Planner (https://registrar.sfsu.edu/degreeplanner)
      and an advisor for further guidance.
    - To avoid taking additional units, it is recommended that you meet the SF State Studies (AERM, GP, ESCA, SJ) requirements
      within your GE or major.
    - '1: Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 1A course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/)'
    - '2: Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 2 course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/)'
    - '3: Complementary Studies. Twelve units of Complementary Studies are required of all candidates for the B.A. in Modern
      Jewish Studies. These units are courses that have a prefix other than JS and that are not cross-listed with Jewish Studies.
      Students can satisfy this requirement by completing a related minor, a second major, studying a pertinent foreign language
      including Hebrew, or through an approved study abroad program. Complementary Studies courses should relate to the Jewish
      Studies major, as well as deepen and enrich student focus in the major, whether that focus is religion, literature,
      philosophy, history, social responsibility, or the study of Israel. Such courses are typically found through the College
      of Liberal & Creative Arts. Note: Students that complete two majors or a major and a minor automatically complete the
      Complementary Studies requirement. Students who have earned AA-T or AS-T degrees and are pursuing a similar B.A. degree
      at SF State are required to fulfill the Complementary Studies requirement as defined by the major department. Students
      should consult with a major advisor about how transfer units and/or SF State units can best be applied to this requirement
      to ensure degree completion within 60 units.'
    - '4: Consider taking a class combined with a laboratory or a separate lab to fulfill 5C if not already satisfied.'
    - '5: Major Core (12 units). A full list of courses that can fulfill this requirement can be found in the Degree Requirements
      (p. 1357).'
    - '6: First-time freshmen must take one lower-division Area 4 course that meets US History (USH).'
    - '7: Electives (12 units). Select four upper-division Jewish Studies courses. These can include courses from the major
      core list. Courses from the major core cannot be double counted to fulfill both the core and elective requirements.
      A maximum of 6 units outside Jewish Studies may be counted toward the major with approval of a major advisor.'
    - '8: GWAR Course (3 units). Select any GWAR course from any discipline or department with approval of a major advisor.'
