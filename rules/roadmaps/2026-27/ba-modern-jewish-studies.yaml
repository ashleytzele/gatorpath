  adt:
    title: Bachelor of Arts in Modern Jewish Studies – Associate Degree for Transfer Roadmap
    total_units: 60
    source: p.1362-1363
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an approved ADT. All lower-division GE requirements have been satisfied. Additional requirements may have been satisfied.
      Check with a major advisor about the most appropriate course sequence. Degree completion guaranteed in 60 units; see
      the Associate Degree for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government & CA State and
      Local Government requirements if not taken before transfer. Upper-Division GE (9 units): Courses required for the major
      may double-count if approved for UD GE. Students entering this major with an approved ADT are not required to fulfill
      SF State Studies requirements. Complementary Studies: Consult with a department advisor on how transfer units and/or
      SF State units can be applied to ensure degree completion within 60 units.'
    - 'Modern Jewish Studies Major: 30 Units. Core (12 units) – Students may apply up to 12 units of Hebrew language transfer
      credit for Hebrew language courses to the Core. GWAR course (3 units) – Select from any discipline or department with
      the approval of a Modern Jewish Studies department advisor. Electives (12 units) – Must be upper-division. May be selected
      from the Core list, but courses cannot double-count for both Core and Elective requirements. Up to 6 units outside Jewish
      Studies may be applied to the major with the approval of a department advisor. Culminating Experience (3 units).'
    - 'University Electives: 3 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., in both UD GE and the major. Upper-division electives recommended to meet the minimum 30-unit requirement.'
    - '1: Major Core (12 units). A full list of courses that can fulfill this requirement can be found in the Degree Requirements
      (p. 1357).'
    - '2: Electives (12 units). Select four Jewish Studies upper-division courses. These can include courses from the major
      core list. Courses from the major core cannot be double counted to fulfill both the core and elective requirements.
      A maximum of 6 units outside Jewish Studies may be counted toward the major with approval of a major advisor.'
    - '3: GWAR Course (3 units). Select any GWAR course from any discipline or department with approval of a major advisor.'
    - 'Associate Degrees for Transfer (ADTs) that are approved for the BA in Modern Jewish Studies are: AA-T in English; AA-T
      in Global Studies; AA-T in History; AA-T in Philosophy; AA-T in Political Science; AA-T in Social Justice Studies.'
