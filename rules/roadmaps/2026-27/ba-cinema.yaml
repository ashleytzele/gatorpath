  adt:
    title: Bachelor of Arts in Cinema – FTVE Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.993-994
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AS-T in Film, Television, and Electronic Media. Up to 13 lower-division units in the major and all lower-division
      GE requirements have been satisfied. Check with a major advisor about the most appropriate course sequence. If equivalent
      courses completed for ADT, CINE 200, CINE 202/CINE 204, CINE 211, and/or CINE 212 are satisfied. Degree completion guaranteed
      in 60 units; see the Associate Degree for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not taken before transfer. Upper-Division GE Areas 2UD/5UD, 3UD, and 4UD
      (9 units): Courses required for the major may double-count if approved for UD GE. Students entering the major with the
      AS-T in FTVE are not required to fulfill SF State Studies requirements. Complementary Studies: consult with a department
      advisor on how transfer units and/or SF State units can be applied to ensure degree completion within 60 units.'
    - 'Cinema Major: 32-45 Units. Core/Foundation/GWAR (7-20 units): Depends upon course choices made at the community college.
      A minimum grade of C is required for all Core, Foundation, and GWAR courses. Required Upper-Division Courses (9 units):
      Select three courses from 300 or 500-level CINE courses; consult Bulletin. Electives (16 units)'
    - 'University Electives: 0 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., both in UD GE and the major.'
    - CINE 204 is waived for students who have completed [CID] FTVE 150. (footnote 1)
    - 'GWAR Course – Select One: A full list of courses that can fulfill this requirement can be found in the Degree Requirements
