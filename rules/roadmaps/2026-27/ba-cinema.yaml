  first-time:
    title: Bachelor of Arts in Cinema Roadmap
    total_units: 120
    source: p.991-992
    notes:
    - '120 Total Units Required. Minimum Number of Units in the Major: 45'
    - This roadmap is a suggested plan of study and does not replace meeting with an advisor. Please note that students may
      need to adjust the actual sequence of courses based on course availability. Please consult your Degree Planner (https://registrar.sfsu.edu/degreeplanner)
      and an advisor for further guidance.
    - To avoid taking additional units, it is recommended that you meet the SF State Studies (AERM, GP, ESCA, SJ) requirements
      within your GE or major.
    - Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 1A course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/) (footnote 1)
    - First-time freshmen must take one lower-division Area 4 course that meets US History (USH). (footnote 2)
    - 'Complementary Studies: Bachelor of Arts students must complete at least 12 units of Complementary Studies outside of
      the primary prefix for the major. (Note: Students may not use an alternate prefix that is cross-listed with the primary
      prefix for the major.) Students who complete two majors or a major and a minor automatically complete the Complementary
      Studies requirement. Cinema majors will be offered several pathways toward completing this requirement, each of which
      is designed to facilitate graduation in a timely manner. Majors may, with the approval of a Cinema advisor, elect to
      apply 12 units in a single foreign language of their choosing, courses taken in an approved study abroad program (e.g.,
      CSU Study Abroad), courses taken as part of a second major, a minor, or a certificate, or courses in related disciplines.
      Related disciplines typically include: anthropology, art, business, creative writing, design, journalism, literature,
      music, philosophy, television, and theater. The School of Cinema allows up to 12 upper-division units from cinema-related
      disciplines to count toward the major. Where upper-division Complementary Studies courses are related to cinema, they
      may, with the approval of a School advisor, also be counted as Cinema electives in fulfillment of major requirements.
      Students who have earned AA-T or AS-T degrees and are pursuing a similar B.A. degree at SF State are required to fulfill
      the Complementary Studies requirement as defined by the major department. Students should consult with a major advisor
      about how transfer units and/or SF State units can best be applied to this requirement to ensure degree completion within
      60 units. (footnote 3)'
    - Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 2 course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/) (footnote 4)
    - Consider taking a class combined with a laboratory or a separate lab to fulfill 5C if not already satisfied. (footnote
      5)
    - 'Major Core (13 units): A full list of courses that can fulfill this requirement can be found in the Degree Requirements
      (p. 987). (footnote 6)'
    - 'GWAR Course – Select One: A full list of courses that can fulfill this requirement can be found in the Degree Requirements
      (p. 987). (footnote 7)'
    - 'Upper-Division Cinema Studies Courses (9 units): Select 9 units from 300 or 500-level CINE courses, not including the
      courses used to fulfill the Foundation and GWAR requirements listed above. Additional GWAR courses may be applied to
      the Upper-Division Cinema Studies Courses requirement. A 500-level CINE course satisfies the Capstone Experience. (footnote
      8)'
    - 'Major Electives (16 units): Select additional upper-division Cinema courses to complete a total of 45 units required
      for the major. A 500-level or 600-level CINE course satisfies the Capstone Experience: With prior approval of an advisor,
      up to 12 units of Cinema-related upper-division courses outside the School of Cinema may count toward the major. No
      more than seven units of advanced production courses may be taken in any one term unless special permission is granted
      by the instructor. If the minimum residence requirement of 12 units in the major is satisfied, credit for upper-division
      courses in the major from another four-year university is possible if syllabi are comparable. A maximum of 18 units
      of online coursework may be counted toward the major. A maximum of 12 units of independent study and internship courses
      may be counted toward the major. A maximum of nine CR/NC units may be counted toward the major, which may include up
      to a maximum of four units of different CINE 325, CINE 326, or CINE 650 courses. GWAR courses in addition to the first
      GWAR course may be counted towards Upper-Division Cinema Studies Courses or Electives. (footnote 9)'
    - 'Capstone Experience (3 units): Any three units at the 500 or 600-level apply, with the exception of CINE 685, CINE
      690, CINE 692, CINE 695, and CINE 699. This course may contribute to the Upper-Division Cinema Studies Requirement or
      the Electives Requirement. (footnote 10)'
