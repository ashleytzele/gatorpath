    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AS-T in Biology. Thirty units in the major (BIOL 230, BIOL 240, CHEM 115, CHEM 215, MATH 226, and the required PHYS
      sequence) and 33 units of lower-division GE requirements have been satisfied. Check with a major advisor about the most
      appropriate course sequence. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section
      for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 15-21 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not met pre-transfer. Lower-Division GE (6 units) – Area 3 (3 units) and
      Area 4 (3 units). Upper-Division GE (9 units): Courses required for the major may double-count if approved for UD GE.
      Students entering this major with the AS-T in Biology are not required to fulfill the SF State Studies requirement.'
    - 'Biology – Microbiology Major: 33 Units. BIOL 230, BIOL 240, MATH 226, all PHYS, CHEM 115, and CHEM 215 met in transfer.
      Lower-Division Requirements (5 units): CHEM 130 or CHEM 233, BIOL 231. Major Upper-Division Requirements/GWAR (19 units).
      Major Upper-Division Electives (9 units).'
    - 'University Electives: 10 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., in both UD GE and the major.'
    - 1. Area 5UD (Upper-Division Science) is satisfied upon completion of BIOL 355.
    - 2. Major Electives (9 units). A full list of courses that can fulfill this requirement can be found in the Degree Requirements
