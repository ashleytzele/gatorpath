  first-time:
    title: 'Bachelor of Arts in Chinese: Concentration in Chinese Language Roadmap'
    total_units: 120
    source: p.1446-1448
    notes:
    - '120 Total Units Required. Minimum Number of Units in the Major: 39'
    - This roadmap is a suggested plan of study and does not replace meeting with an advisor. Please note that students may
      need to adjust the actual sequence of courses based on course availability. Please consult your Degree Planner (https://registrar.sfsu.edu/degreeplanner)
      and an advisor for further guidance.
    - To avoid taking additional units, it is recommended that you meet the SF State Studies (AERM, GP, ESCA, SJ) requirements
      within your GE or major.
    - 1. Up to 12 units from the lower-division core (CHIN 101, CHIN 102, and/or CHIN 103) can be replaced with high school
      Advanced Placement (AP) examination credit (see University guidelines). With the consent of a Chinese Program advisor,
      students able to demonstrate a higher level of Chinese language proficiency may replace lower-division core units with
      upper-division Chinese language units.
    - 2. Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 1A course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/)
    - '3. Complementary Studies. Required of all candidates for the Bachelor of Arts degree in Chinese are 12 units of Complementary
      Studies, which must come from courses bearing a prefix other than CHIN, and not cross-listed with CHIN. Complementary
      Studies for the Chinese major can be satisfied via four possible routes: • 12 units in any foreign language other than
      Chinese (may include up to 3 units of MLL prefix courses); • 12 units of coursework taken in an approved study abroad
      program (including CSU Study Abroad, SF State Bilateral, Chinese Flagship, and SLI Translation-Interpretation programs)*;
      • 12 units of coursework taken as part of a second major, a minor, or a certificate; • 12 units of coursework in related
      disciplines with the approval of a Chinese Program advisor. Related disciplines typically include linguistics, literature,
      philosophy, history, education, and any aspect of greater China, East Asia, or Asian Americans. Where a course with
      a non-CHIN prefix is taken as a core requirement or elective for the Chinese major, the said course may also (double)
      count towards Complementary Studies only via the Study Abroad option or the 2nd Major/Minor/Certificate option listed
      above. Students satisfying Complementary Studies through the Foreign Language option are allowed a maximum of 3 units
      of overlap of FL-prefix courses between Chinese major and Complementary Studies units. Students satisfying Complementary
      Studies through the Related Subjects option are not allowed to double-count major and Complementary Studies units.'
    - 4. Civilization and Culture (3 units). A full list of courses that can fulfill this requirement can be found in the
      Degree Requirements (p. 1443).
    - 5. Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 2 course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/)
    - 6. First-time freshmen must take one lower-division Area 4 course that meets US History (USH).
    - 7. Consider taking a class combined with a laboratory or a separate lab to fulfill 5C if not already satisfied.
    - 8. Electives (0-9 units). Additional upper-division CHIN-prefix courses as needed to reach a total of 39 units in the
      major. The number of elective units needed is dependent on how many units of the lower-division core are met through
      AP tests.
    - 9. Literature in Translation (3 units). A full list of courses that can fulfill this requirement can be found in the
      Degree Requirements (p. 1443).
    - 10. Graduation Writing Requirement (GWAR) (0-3 units). Only to be taken if not chosen from the 600-level courses in
      Literature in Translation (CHIN 601GW, CHIN 611GW, or CHIN 612GW).
    - 11. Content Course (3 units). A full list of courses that can fulfill this requirement can be found in the Degree Requirements
      (p. 1443).
