  adt:
    title: Bachelor of Arts in Communication Studies – COMM Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.1043-1044
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AA-T in Communication Studies. Six units (all lower-division major requirements) and all lower-division GE requirements
      have been satisfied. Check with a major advisor about the most appropriate course sequence. Degree completion guaranteed
      in 60 units; see the Associate Degree for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9–15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not taken before transfer. Upper-Division GE Areas 2UD/5UD, 3UD, and 4UD
      (9 units): Courses required for the major may double-count if approved for UD GE. Students entering this major with
      the AA-T in Communication Studies are not required to fulfill SF State Studies requirements.'
    - 'Communication Studies Major: 32 Units. Introductory Courses requirement satisfied in transfer. Graduation Writing Assessment
      Requirement/GWAR (4 units); Area Requirements (20 units) consisting of: Social Contexts and Interaction in Communication
      (8 units), Rhetoric and Performance in Communication (8 units), Communication Inquiry (4 units); Electives (6 units);
      Capstone (2 units).'
    - 'University Electives: 13 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., both in UD GE and the major.'
    - 'Social Contexts and Interaction in Communication (8 units): A full list of courses that can fulfill this requirement
      can be found in the Degree Requirements (p. 1038). (footnote 1)'
    - 'Rhetoric and Performance in Communication (8 units): A full list of courses that can fulfill this requirement can be
