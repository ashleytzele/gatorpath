    title: Bachelor of Arts in Communication Studies Roadmap
    total_units: 120
    source: p.1041-1042
    notes:
    - This roadmap is a suggested plan of study and does not replace meeting with an advisor. Please note that students may
      need to adjust the actual sequence of courses based on course availability. Please consult your Degree Planner (https://registrar.sfsu.edu/degreeplanner)
      and an advisor for further guidance.
    - To avoid taking additional units, it is recommended that you meet the SF State Studies (AERM, GP, ESCA, SJ) requirements
      within your GE or major.
    - Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 1A course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/) (footnote 1)
    - First-time freshmen must take one lower-division Area 4 course that meets US History (USH). (footnote 2)
    - Students should use their Pathway/Category (https://gatorsmartstart.sfsu.edu/pathways) to determine the appropriate
      GE 2 course option. For directions on how to view your Pathway/Category, visit how to find your pathway (https://gatorsmartstart.sfsu.edu/howtofindyourpathways).
      Questions? Contact Gator Smart Start. (https://gatorsmartstart.sfsu.edu/) (footnote 3)
    - Consider taking a class combined with a laboratory or a separate lab to fulfill 5C if not already satisfied. (footnote
      4)
    - 'Introductory Course (6 units): A full list of courses that can fulfill this requirement can be found in the Degree
      Requirements (p. 1038). (footnote 5)'
    - 'Social Contexts and Interaction in Communication (8 units): A full list of courses that can fulfill this requirement
      can be found in the Degree Requirements (p. 1038). (footnote 6)'
    - 'Rhetoric and Performance in Communication (8 units): A full list of courses that can fulfill this requirement can be
      found in the Degree Requirements (p. 1038). (footnote 7)'
    - 'Communication Inquiry: A full list of courses that can fulfill this requirement can be found in the Degree Requirements
      (p. 1038). (footnote 8)'
    - 'Electives (6 units): Students may only apply up to 4 units for each course in the major, though some courses are repeatable
      for credit toward electives. All upper-division COMM courses between COMM 400-599 may be used as electives only if their
      corresponding area above is already met with other courses. For example, if a student has completed 8 units of Rhetoric
      and Performance, they may take additional units in Rhetoric and Performance to apply towards the electives requirement.
      Only 2 units from a lower-division COMM class may count towards the electives requirement. The following courses can
      also be used to fulfill electives requirements: COMM 368 Forensics (2 units); COMM 685 Projects in the Teaching of Communication
      (1-4 units); COMM 695 Internship in Communication Studies (3 units). (footnote 9)'
