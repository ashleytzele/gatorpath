  adt:
    title: Bachelor of Arts in Women and Gender Studies – SJS Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.1709-1710
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AA-T in Social Justice Studies. Up to 3 units in the major (Electives) and all lower-division GE requirements have
      been satisfied. Check with a major advisor about the most appropriate course sequence. Degree completion guaranteed
      in 60 units; see the Associate Degree for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not taken before transfer. Upper-Division GE (9 units): Courses required
      for the major may double-count if approved for UD GE. Students entering the major with the AA-T in Social Justice Studies
      are not required to fulfill SF State Studies requirements.'
    - 'Women and Gender Studies Major: 27 Units. Up to 3 units from the SJS ADT may be applied to the Elective Course area.
      Core courses (12 units) – includes a GWAR-designated course. Praxis (3 units). Body Politics (3 units). Power and Violence
      (3 units). Culture, Media, and Art (3 units). Social Movements (3 units).'
    - 'University Electives: 18 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., in both UD GE and the major.'
    - 1. Introductory Core Course (6 units). A full list of courses that can fulfill this requirement can be found in the
      Degree Requirements (p. 1704).
    - 2. Praxis (3 units). A full list of courses that can fulfill this requirement can be found in the Degree Requirements
