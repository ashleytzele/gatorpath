      course sequence. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section for more
      information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not met before transfer. Upper-Division GE Areas 2UD/5UD, 3UD, and 4UD (9
      units): Upper-division GE (9 units): Courses required for the major may double-count if approved for UD GE. Students
      entering this major with an approved ADT are not required to fulfill SF State Studies requirements.'
    - 'Urban Studies and Planning Major: 39 Units. Core Courses (21-22 units). Elective Courses: (18 units).'
    - 'University Electives: 5 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., in both UD GE and the major.'
    - 'Footnote 1: Major Electives (18 units). A full list of courses that can fulfill this requirement can be found in the
      Degree Requirements (p. 867).'
    - 'Associate Degrees for Transfer (ADTs) that are approved for the BA in Urban Studies and Planning are: AA-T Law, Public
      Policy, and Society; AA-T Political Science; AA-T Social Justice Studies; AS-T Sociology.'
