  adt:
    title: 'Bachelor of Arts in English: Concentration in English Education – Associate Degree for Transfer (ADT) Roadmap'
    total_units: 60
    source: p.1126-1127
    met_in_transfer:
    - ENG 218
    - ENG 250
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an approved ADT. Six lower-division units in the major (ENG 218 and ENG 250) and all lower-division GE requirements
      have been satisfied. Additional units in the major may have been satisfied. Check with a major advisor about the most
      appropriate course sequence. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section
      for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not taken before transfer. Upper-Division GE (9 units): Courses required
      for the major may double-count if approved for UD GE. Students entering this major with an approved ADT are not required
      to fulfill SF State Studies requirements. Complementary Studies: Consult with a department advisor on how transfer units
      and SF State units can be applied to ensure degree completion within 60 units.'
    - 'English (English Education) Major: 39-40 Units. Lower-Division requirements met in transfer; see department advisor
      regarding applying additional units from ADT, if any. Upper-Division Requirements (18 units). Concentration Requirements
      (21-22 units) - includes: Applied Linguistics; Literature: Adolescent: ENG 655; Literacy: ENG 417. Includes 25 hours
      of community service learning.; Advanced Composition: ENG 419. Includes 20 hours of community service learning.; Mythology
      and Oral Traditions; Speech Performance; Capstone Experience (3 units): ENG 688. Must be taken in the final semester
      of the final year and will include an English Education e-portfolio.'
    - 'University Electives: 9 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., in both UD GE and the major.'
    - 1 Mythology and Oral Traditions - Select One. A full list of courses that can fulfill this requirement can be found
      in the Degree Requirements (p. 1121).
    - 'Associate Degrees for Transfer (ADTs) that are approved for the BA in English: Concentration in English Education are:
      AA-T Child & Adolescent Development; AS-T Early Childhood Education; AA-T Elementary Teacher Education; AA-T Global
      Studies; AA-T Social Justice Studies; AA-T Theater Arts; AA-T Spanish.'
