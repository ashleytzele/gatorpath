  adt:
    title: 'Bachelor of Science in Business Administration: Concentration in Finance – BUS Associate Degree for Transfer (ADT)
      with 15 Lower-Division Units Roadmap'
    total_units: 60
    source: p.159-160
    met_in_transfer:
    - ACCT 100
    - ACCT 101
    - DS 212
    - ECON 101
    - ECON 102
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AS-T in Business Administration (VERSION 2.0, established Spring 2021). 15 units in the major [ACCT 100, ACCT 101,
      DS 212/ECON 212, ECON 101, ECON 102] and all lower division GE requirements have been satisfied. Additional units in
      the major may have been satisfied. Check with a major advisor about the most appropriate course sequence. Degree completion
      guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not met pre-transfer. Upper-Division GE Areas 2UD/5UD, 3UD, and 4UD (9 units):
      Courses required for the major may double-count if approved for UD GE. Students entering the major with the AS-T in
      Business Administration with a concentration in Finance are not required to fulfill SF State Studies requirements.'
    - 'BS in Business Administration: Concentration in Finance Major: 48-54 Units. ACCT 100/ACCT 101, DS 212/ECON 212, ECON
      101/ECON 102 met in transfer. Prerequisites (0-6 units): DS 110 or MATH 110 and ISYS 263 if not met in transfer. Upper-division
      core courses for Business majors (27 units). Concentration (21 units) – FIN 351 or FIN 357, FIN 353, FIN 355, FIN 536,
      and three Concentration Electives'
    - 'University Electives: 0 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State - some courses may meet more than one requirement,
      e.g., in both UD GE and in the major.'
    - '1: Major Electives (9-10 units). A full list of courses that can fulfill this requirement can be found in the Degree
      Requirements (p. 152).'
    semesters:
    - units: 15
      source: p.159
      items:
      - BUS 300GW
      - ISYS 263
      - FIN 350
      - MGMT 405
      - slot: major
        group: prereq_calculus
        units: 3
        note: 'Select One (Major Prerequisite, GE 2): DS 110 or MATH 110'
    - units: 15
      source: p.159-160
      items:
      - DS 412
      - FIN 353
      - ISYS 363
      - slot: major
        group: concentration_select_one
        units: 3
        note: 'Select One (Major Concentration): FIN 351 or FIN 357'
      - slot: GE
        area: 3UD
        units: 3
        note: 'Select One (GE 3UD, USH, USG/CSLG): HIST 470 or HIST 471'
      - slot: ai
        area: USH/USG/CSLG
        units: 0
        note: the same HIST 470 or HIST 471 course
    - units: 15
      source: p.160
      items:
      - FIN 355
      - FIN 536
      - MKTG 431
      - slot: major
        group: electives
        units: 3
        note: Concentration Elective (9-10 units); footnote 1
      - slot: GE
        area: 5UD/2UD
        units: 3
    - units: 15
      source: p.160
