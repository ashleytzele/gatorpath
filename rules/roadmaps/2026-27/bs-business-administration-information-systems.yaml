        - MATH 110
        units: 3
        note: Select One (Prerequisite, GE 2)
    - units: 15
      source: p.209
      items:
      - DS 412
      - ISYS 350
      - ISYS 363
      - slot: GE
        area: 3UD
        units: 3
        note: 'Select One (GE 3UD, USH, USG/CSLG): HIST 470 or HIST 471'
      - slot: GE
        area: 5UD/2UD
        units: 3
        note: Upper-Division Sciences or Upper-Division Mathematical Concepts
    - units: 15
      source: p.210
      items:
      - MKTG 431
      - ISYS 463
      - ISYS 464
      - ISYS 565
      - ISYS 663
    - units: 15
