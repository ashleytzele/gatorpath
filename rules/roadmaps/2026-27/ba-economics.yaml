  adt:
    title: Bachelor of Arts in Economics – ECON Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.140-141
    met_in_transfer:
    - ECON 101
    - ECON 102
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AA-T in Economics. At least six units in the major (ECON 101, ECON 102) and all lower-division GE requirements have
      been satisfied. Additional units in the major may have been satisfied. Check with a major advisor about the most appropriate
      course sequence. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section for more
      information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 40 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not taken before transfer. Upper-Division GE, Areas 2UD/5UD, 3UD, and 4UD
      (9 units): Courses required for the major may double-count if approved for UD GE. Students entering this major with
      the AA-T in Economics are not required to fulfill SF State Studies requirements. Complementary Studies: Consult with
      a department advisor on how transfer units and SF State units can be applied to ensure degree completion within 60 units.'
    - 'Economics Major: 33–37 Units. ECON 101 and ECON 102 met in transfer; MATH 226 may have been met in transfer. Major
      Core (15-19 units) - includes Culminating Experience/GWAR course. Major Electives (18 units).'
    - 'University Electives: 8 or More Units. Depending on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., UD GE and the major.'
    - '1: Upper-Division Electives (18 Units). A full list of courses that can fulfill this requirement can be found in the
      Degree Requirements (p. 133).'
    semesters:
    - units: 16
      source: p.140
      items:
      - slot: major
        group: core_calculus
        units: 4
        note: 'Select One (Major Core, GE 2): DS 110, MATH 110 or MATH 226; printed 3-4 units, counted at 4 so the semester
          adds up to its printed 16'
      - slot: GE
        area: 5UD/2UD
        units: 3
        note: Upper-Division Sciences or Upper-Division Mathematical Concepts
      - slot: ai
        area: USH
        units: 3
        note: US History (p. 2350), or University Elective if US History met before transfer
      - slot: ai
        area: USG/CSLG
        units: 3
        note: US and California Government (p. 2351), or University Elective if US/CA Government met before transfer
      - slot: elective
        units: 3
    - units: 14
      source: p.140
      items:
      - ECON 301
      - slot: major
        group: core_statistics
        units: 3
        note: 'Select One (Major Core): DS/ECON 212 or MATH 124 (GE 2)'
      - slot: major
        group: upper_division_electives
        units: 3
        note: Major Elective (18 units); footnote 1
      - slot: elective
        units: 5
        note: Take Two
    - units: 15
      source: p.140-141
      items:
      - ECON 302
      - ECON 312
      - slot: major
        group: upper_division_electives
        count: 2
        units: 6
        note: Major Elective (18 units) - Take Two; footnote 1
      - slot: GE
        area: 3UD
        units: 3
        note: Upper-Division Arts or Humanities
    - units: 15
      source: p.141
      items:
      - ECON 690GW
      - slot: major
        group: upper_division_electives
        count: 3
        units: 9
        note: Major Elective (18 units) - Take Three; footnote 1
      - slot: GE
        area: 4UD
        units: 3
        note: Upper-Division Social and Behavioral Sciences
