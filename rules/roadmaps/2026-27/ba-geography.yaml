  adt:
    title: Bachelor of Arts in Geography – GEOG Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.2032-2033
    met_in_transfer:
    - GEOG 101
    - GEOG 102
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AA-T in Geography. Six units in the major (GEOG 101 and GEOG 102) and all lower-division GE requirements have been
      satisfied. Additional units in the major may have been satisfied. Check with a major advisor about the most appropriate
      course sequence. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section for more
      information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not taken before transfer. Upper-Division GE Areas 2UD/5UD, 3UD, and 4UD
      (9 units): Courses required for the major may double-count if approved for Upper-Division GE. Students entering the
      major with the AA-T in Geography are not required to fulfill SF State Studies requirements.'
    - 'Geography Major: 30-37 Units. GEOG 101 and GEOG 102 met in transfer. Core (3-6 units): ENV 205 (if not met in transfer)
      and ENV 500GW. Distribution Requirement (12-16 units): Choose one GEOG course from four different areas: Physical Geography
      (310-399 level); Human Geography (400 level); Human-Environment Interaction in a Regional Context; Geographic Techniques
      (601-639) OR Applied Geography (640-668). Major Electives (12 units): Choose upper-division courses organized around
      a coherent theme in consultation with an advisor. Capstone (3 units): ENV 690.'
    - 'University Electives: 12 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., in both Upper-Division GE and the major.'
    - 'Distribution Requirement (12-16 units): A full list of courses that can fulfill this requirement can be found in the
      Degree Requirements (p. 2027). (footnote 1)'
    - 'Major Electives (12 units): A full list of courses that can fulfill this requirement can be found in the Degree Requirements
      (p. 2027). (footnote 2)'
