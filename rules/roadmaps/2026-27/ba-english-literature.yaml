  adt:
    title: 'Bachelor of Arts in English: Concentration in Literature – Associate Degree for Transfer (ADT) Roadmap'
    total_units: 60
    source: p.1159-1160
    met_in_transfer:
    - ENG 218
    - ENG 250
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an approved ADT. Six lower-division units in the major (ENG 218 and ENG 250) and all lower-division GE requirements
      have been satisfied. Additional units in the major may have been satisfied. Check with a major advisor about the most
      appropriate course sequence. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section
      for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not taken before transfer. Upper-Division GE Areas 2UD/5UD, 3UD, and 4UD
      (9 units): Courses required for the major may double-count if approved for UD GE. Students entering this major with
      an approved ADT are not required to fulfill SF State Studies requirements. Complementary Studies: Consult with a department
      advisor on how transfer units and/or SF State units can be applied to ensure degree completion within 60 units.'
    - 'English (Literature) Major: 39 Units. Lower-division requirements met in transfer. Upper-Division Requirements (18
      units). Concentration Requirements (21 units) - includes: Survey (3 units) - ENG 460; Theory or Criticism (3 units);
      Pre-1800 Literature (3 units); Electives (9 units); Capstone Experience (3 units) - ENG 690. Must be taken in one of
      the final two semesters.'
    - 'University Electives: 9 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., both in UD GE and the major.'
    - 'Footnote 1: Theory or Criticism (3 units). A full list of courses that can fulfill this requirement can be found in
      the Degree Requirements (p. 1153).'
    - 'Footnote 2: Pre-1800 Literature (3 units). A full list of courses that can fulfill this requirement can be found in
      the Degree Requirements (p. 1153).'
    - 'Footnote 3: Electives (9 units). A full list of courses that can fulfill this requirement can be found in the Degree
      Requirements (p. 1153).'
    - 'Associate Degrees for Transfer (ADTs) that are approved for the BA in English: Concentration in Literature are: AA-T
      English, AA-T Global Studies, AA-T Social Justice Studies, AA-T Spanish, AA-T Theater Arts.'
