      course sequence. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer (ADT) section for more
      information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not taken before transfer. Upper-Division GE (9 units): Courses required
      for the major may double-count if approved for UD GE. Students entering the major with an approved ADT are not required
      to fulfill SF State Studies requirements. Complementary Studies: Consult with a department advisor on how transfer units
      and/or SF State units can be applied to ensure degree completion within 60 units.'
    - 'American Studies Major: 39 Units. Required Courses (18 units) – includes GWAR course. Elective Courses (21 units) –
      Courses, by choice and advisement, on a topic or theme in American Studies, drawn from at least two disciplines. Consult
      with the department advisor about applying up to 6 units from the ADT. Consult the University Bulletin for a list of
      appropriate departments.'
    - 'University Electives: 9 Units or More. Units depend on course choices made at the community college, how transferred
      units are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., both in UD GE and the major. Upper-division electives are recommended in order to meet the minimum 30-unit upper-division
      requirement.'
    - '1: Elective Courses (21 units). Courses, by choice and advisement, on a topic or theme in American Studies, drawn from
