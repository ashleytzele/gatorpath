  adt:
    title: Bachelor of Science in Biochemistry – CHEM Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.1876-1877
    met_in_transfer:
    - CHEM 115
    - CHEM 215
    - CHEM 233
    - CHEM 234
    - CHEM 235
    - MATH 226
    - MATH 227
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AS-T in Chemistry. Thirty-two units in the major (CHEM 115, CHEM 215, CHEM 233, CHEM 234, CHEM 235, MATH 226, MATH
      227, and the required PHYS sequence) and 33 units of lower-division GE have been satisfied. Check with a major advisor
      about the most appropriate course sequence for you. Degree completion guaranteed in 60 units; see the Associate Degree
      for Transfer (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 15-21 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not taken before transfer. Lower-Division GE (6 units) – Area 3 (3 units
      in any subarea) and Area 4 (3 units). Upper-Division GE Areas 2UD/5UD, 3UD, and 4UD (9 units) – Courses may satisfy
      the US History or US/CA Government requirements, and Upper-Division GE at the same time, if approved for multiple areas.
      Students entering the major with the AS-T in Chemistry are not required to fulfill SF State Studies requirements.'
    - 'Biochemistry BS: 35 Units. Completed: CHEM 115, CHEM 215, CHEM 233, CHEM 234, CHEM 235, MATH 226, MATH 227, and the
      required PHYS sequence. Major Lower-Division Requirements (5 units) – BIOL 230. Major Upper-Division Requirements (18
      units). Major Upper-Division Electives (12 units) - including at least one course with a CHEM prefix, at least one course
      with GW suffix (fulfills University GWAR requirement), at least three laboratory courses.'
    - Note that many BIOL electives require BIOL 240 as a prerequisite; enrollment without this prereq in BIOL 350, BIOL 355,
      and BIOL 612 may be permitted, but students must consult with a department advisor prior to registering for these courses.
    - 'University Electives: 4 or More Units. Depends on course choices made at the community college, how transferred units
      are applied to the requirements above, and course choices at SF State. Some courses may meet more than one requirement,
      e.g., UD GE and the major.'
    - '1: Upper-Division Electives (12 units). A full list of courses that can fulfill this requirement can be found in the
      Degree Requirements (p. 1868).'
