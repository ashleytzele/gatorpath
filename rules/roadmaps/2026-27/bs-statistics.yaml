  adt:
    title: Bachelor of Science in Statistics – MATH Associate Degree for Transfer (ADT) Roadmap
    total_units: 60
    source: p.2148-2149
    met_in_transfer:
    - MATH 226
    - MATH 227
    - MATH 228
    notes:
    - This is a sample pathway for students who transfer to San Francisco State University in the current Bulletin year with
      an AS-T in Mathematics. At least 12 units in the major (MATH 226, MATH 227, and MATH 228) and all lower-division GE
      requirements have been satisfied. Additional units in the major may have been satisfied. Check with a major advisor
      about the most appropriate course sequence. Degree completion guaranteed in 60 units; see the Associate Degree for Transfer
      (ADT) section for more information (p. 2304).
    - 'To Do at SF State: Enough total units to reach 120 minimum for graduation; 30 units minimum at the upper-division level;
      to include the following:'
    - 'University-Wide Requirements: 9-15 Units. American Institutions (0-6 units): US History, US Government, California
      State and Local Government requirements if not taken before transfer. Upper-Division GE Areas 2UD/5UD, 3UD, and 4UD
      (9 units): Courses required for the major may double-count if approved for UD GE. Students entering the major with the
      AS-T in Mathematics are not required to fulfill SF State Studies requirements.'
    - 'Statistics Major: 40-43 units. MATH 226, MATH 227, and MATH 228 met in transfer. Core (31-34 units). Guided Electives
      (9 units) in one of the following areas: Science, Economics, Business: Decision Sciences, or Business: Information Systems.
      Consult with a department advisor.'
    - 'University Electives: 4 or More Units. Depends on the number of units transferred, course choices made at the community
      college, and how transferred units are applied to the requirements above.'
    - 'Footnote 1: Guided Electives (9 units). A full list of courses that can fulfill this requirement can be found in the
      Degree Requirements (p. 2141).'
